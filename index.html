<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bestellungen">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Bestellungen</title>
<style>
:root{
  --bg:#f2f3f6; --karte:#fff; --text:#1b1e23; --leise:#6b7280; --linie:#e4e6ea;
  --akzent:#1f2937; --link:#1f2937; --ok:#2b8a3e; --rot:#c92a2a; --warn:#a85400; --warn-bg:#fff4e6;
  --r:14px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111316; --karte:#1c1f24; --text:#eceef1; --leise:#9aa1ab; --linie:#2e3239;
         --link:#9db4ff; --warn:#f0a040; --warn-bg:#33270f; --ok:#51cf66; --rot:#ff8787; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
body.modal{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
[hidden]{display:none !important}

/* ---------- Kopfzeile ---------- */
#kopf{position:sticky;top:0;z-index:20;background:var(--akzent);color:#fff;
  padding-top:env(safe-area-inset-top);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.kopf-zeile{display:flex;align-items:center;gap:6px;min-height:54px;padding:0 10px}
.kopf-titel{flex:1;min-width:0;font-weight:700;font-size:19px;line-height:1.15;padding-left:4px}
.kopf-unter{font-size:12.5px;font-weight:400;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rund{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:rgba(255,255,255,.17);
  color:#fff;font-size:20px;display:grid;place-items:center}
.rund.zurueck{font-size:30px;line-height:1;padding-bottom:4px}
.reiter{display:flex;padding:0 6px}
.reiter a{flex:1;text-align:center;color:#fff;opacity:.72;text-decoration:none;padding:9px 2px 10px;
  font-weight:600;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
.reiter a.aktiv{opacity:1;border-bottom-color:#fff}
.reiter .marke{background:#fff;color:var(--akzent)}

main{max-width:760px;margin:0 auto}

/* ---------- Allgemein ---------- */
.marke{display:inline-block;min-width:22px;text-align:center;background:var(--akzent);color:#fff;
  border-radius:999px;padding:1px 7px;font-size:12.5px;font-weight:700;line-height:1.5}
.karte{background:var(--karte);border-radius:var(--r);margin:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);overflow:hidden}
.karte-inhalt{padding:14px}
.karte h3{margin:0;padding:14px 14px 4px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--leise)}
.leise{color:var(--leise)}
.klein{font-size:13.5px}
.leer{text-align:center;color:var(--leise);padding:22px 16px;margin:0}
.link{background:none;border:0;padding:6px 4px;color:var(--link);font-weight:600}
.link.rot{color:var(--rot)}
.knopf{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;
  border-radius:12px;border:1px solid var(--linie);background:var(--karte);font-weight:600;
  text-decoration:none;padding:10px 14px}
a.knopf{color:var(--text)}
.knopf.haupt{background:var(--akzent);border-color:var(--akzent);color:#fff}
.knopf.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.knopf.aktiv{background:var(--akzent);border-color:var(--akzent);color:#fff}

/* ---------- Startseite / Kacheln ---------- */
.start-text{margin:18px 16px 4px;color:var(--leise);font-size:15px}
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:12px 12px 4px}
.kachel{display:flex;flex-direction:column;padding:0;border:0;border-radius:18px;overflow:hidden;text-align:left;
  background:var(--karte);box-shadow:0 1px 3px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.05)}
.kachel:active{transform:scale(.985)}
.band{display:block;height:7px;background:linear-gradient(90deg,var(--f1),var(--f2))}
.k-inhalt{display:flex;align-items:center;gap:14px;padding:16px}
.monogramm{width:58px;height:58px;flex:none;border-radius:16px;background:var(--f1);color:#fff;
  font-weight:800;font-size:28px;display:grid;place-items:center}
.k-text{flex:1;min-width:0;display:flex;flex-direction:column}
.k-name{font-weight:700;font-size:19px}
.k-unter{color:var(--leise);font-size:14px}
.k-info{color:var(--leise);font-size:13px;margin-top:4px}
.k-marke{background:var(--f1);color:#fff;border-radius:999px;font-weight:700;font-size:14px;padding:3px 10px}
.k-pfeil{font-size:26px;color:var(--leise)}
.fuss{display:block;margin:22px auto 0;background:none;border:0;color:var(--leise);font-size:13.5px;padding:8px}

/* ---------- Produkte ---------- */
.werkzeug{display:flex;gap:8px;padding:12px 12px 0;align-items:center}
.werkzeug input[type=search]{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--linie);
  background:var(--karte);padding:0 12px;font-size:16px}
.werkzeug .knopf{width:auto;min-height:44px;padding:0 14px}
.hinweiszeile{padding:8px 16px 0;font-size:12.5px;color:var(--leise)}
.info-box{margin:10px 12px 0;padding:10px 12px;border-radius:12px;background:var(--karte);border:1px dashed var(--akzent);font-size:14px}
.liste-kopf{display:flex;justify-content:flex-end;padding:2px 10px 0}
.kat{background:var(--karte);border-radius:var(--r);margin:8px 12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kat-kopf{display:flex;align-items:center;gap:10px;width:100%;padding:14px;border:0;background:none;text-align:left;font-weight:650;font-size:16.5px}
.kat-kopf .pfeil{display:inline-block;transition:transform .18s;color:var(--leise);font-size:20px;width:12px}
.kat.offen .kat-kopf .pfeil{transform:rotate(90deg)}
.kat-name{flex:1}
.zahl{font-size:13px;color:var(--leise);font-weight:500}
.kat:not(.offen) .kat-inhalt{display:none}
.kat-alle{display:flex;justify-content:space-between;padding:0 10px 6px;border-top:1px solid var(--linie)}
.g-name{padding:12px 14px 0;font-weight:600;border-top:1px solid var(--linie)}
.art{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-top:1px solid var(--linie)}
.art.variante{border-top:0;padding-top:6px;padding-left:26px}
.gruppe .art.variante + .art.variante{border-top:1px dashed var(--linie)}
.art.hat-menge{background:rgba(127,127,127,.10);background:color-mix(in srgb,var(--akzent) 11%,var(--karte))}
.art.aus .art-text{opacity:.45}
.art-text{flex:1;min-width:0}
.a-name{font-weight:600}
.info{font-size:13.5px;color:var(--leise)}
.preis{font-size:13.5px}
.warn{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:2px 6px;margin-top:3px;display:inline-block}
.aus-label{font-size:12px;color:var(--leise);font-style:italic}
.stepper{display:flex;align-items:center;flex:none;border:1px solid var(--linie);border-radius:12px;overflow:hidden;background:var(--karte)}
.stepper button{width:40px;height:42px;border:0;background:transparent;font-size:23px;line-height:1;color:var(--link)}
.stepper input{width:42px;height:42px;border:0;border-left:1px solid var(--linie);border-right:1px solid var(--linie);
  text-align:center;font-size:17px;font-weight:700;background:transparent;-moz-appearance:textfield;appearance:textfield;padding:0}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.schalter{position:relative;flex:none;width:52px;height:32px}
.schalter input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.schalter span{position:absolute;inset:0;border-radius:999px;background:#c5c9d0;transition:background .15s}
.schalter span::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.schalter input:checked + span{background:var(--ok)}
.schalter input:checked + span::after{transform:translateX(20px)}

/* ---------- Bestellzettel ---------- */
.klapp-kopf{display:flex;align-items:center;gap:10px;width:100%;padding:14px;border:0;background:none;text-align:left;font-weight:650}
.klapp-kopf .pfeil{display:inline-block;transition:transform .18s;color:var(--leise);font-size:20px;width:12px}
.klapp.offen > .klapp-kopf .pfeil{transform:rotate(90deg)}
.klapp-kopf .sub{display:block;font-weight:400;font-size:13px;color:var(--leise)}
.klapp:not(.offen) > .klapp-inhalt{display:none}
.klapp-inhalt{padding:0 14px 14px}
.feld{display:block;margin-top:10px}
.feld > span{display:block;font-size:13px;color:var(--leise);margin-bottom:3px}
.feld input,.feld textarea,.feld select{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--linie);
  background:var(--bg);padding:9px 11px;font-size:16px}
.feld textarea{min-height:64px;resize:vertical}
.pos{display:flex;align-items:center;gap:10px;padding:11px 12px 11px 14px;border-top:1px solid var(--linie)}
.pos:first-child{border-top:0}
.summe{display:flex;justify-content:space-between;align-items:baseline;padding:13px 14px;border-top:2px solid var(--linie);font-weight:700;font-size:17px}
.summe small{display:block;font-weight:400;font-size:12px;color:var(--leise)}
.aktionen{display:grid;gap:10px;padding:0 12px}
.hist{padding:10px 0;border-top:1px solid var(--linie)}
.hist:first-child{border-top:0}
.hist ul{margin:4px 0;padding-left:20px;font-size:14px}
.hist-akt{display:flex;justify-content:space-between}

.preisfeld{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px;margin-top:4px}
.preisfeld input{width:92px;height:38px;border-radius:9px;border:1px solid var(--linie);background:var(--bg);
  padding:0 8px;font-size:16px;text-align:right}
.leiste{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:15;max-width:736px;margin:0 auto;
  display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--akzent);color:#fff;text-decoration:none;
  border-radius:14px;padding:10px 16px;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.leiste small{display:block;font-size:12.5px;opacity:.92}
.leiste.ok small{font-weight:700}
.leiste-ziel{font-weight:700;white-space:nowrap}
#leisteBox:not(:empty){height:84px}
.mindest{padding:0 14px 14px;font-size:14.5px}
.mindest .balken{height:8px;border-radius:99px;background:var(--linie);overflow:hidden;margin-bottom:6px}
.mindest .balken span{display:block;height:100%;background:#e8590c;border-radius:99px}
.mindest.erreicht{color:var(--ok);font-weight:700}
.mindest.erreicht .balken span{background:var(--ok)}
.klein-aktionen{display:flex;justify-content:center;gap:18px}
.wege{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.weg{position:relative}
.weg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.weg span{display:block;text-align:center;border:1px solid var(--linie);border-radius:12px;padding:8px 2px;font-size:14px;line-height:1.5;background:var(--bg)}
.weg input:checked + span{border-color:var(--akzent);background:var(--akzent);color:#fff;font-weight:700}
details.hist{padding:2px 0;border-top:1px solid var(--linie)}
details.hist:first-child{border-top:0}
details.hist summary{padding:10px 0 10px 22px;cursor:pointer;list-style:none;position:relative}
details.hist summary::-webkit-details-marker{display:none}
details.hist summary::before{content:"›";position:absolute;left:4px;top:8px;font-size:20px;color:var(--leise);transition:transform .18s}
details.hist[open] summary::before{transform:rotate(90deg)}
.hist-sub{display:block;font-size:13px;color:var(--leise);font-weight:400}
.notiz{font-size:14px;background:var(--bg);border-radius:8px;padding:6px 8px;margin:2px 0 6px}

.sync-zeile{display:block;margin:18px auto 0;background:var(--karte);border:1px solid var(--linie);border-radius:999px;
  padding:8px 16px;font-size:14px;color:var(--text);max-width:92%}
.sync-zeile.fehler{color:var(--warn);border-color:var(--warn)}
.hinweis-karte{border:1px solid var(--warn)}
.sy-info{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.7}
.sy-meldung{display:block;margin-top:12px;font-size:14px}
.sy-verlauf{margin-top:12px;font-size:13.5px}
.sy-verlauf summary{padding:6px 0;cursor:pointer;font-weight:600}
.sy-verlauf ul{margin:4px 0;padding-left:18px}

.update-leiste{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff4e6;color:#5c3200;
  padding:8px 12px;font-size:14.5px;border-top:1px solid rgba(0,0,0,.08)}
.update-leiste.innen{border:1px solid #f0a040;border-radius:12px;margin:8px 0}
.update-knopf{flex:none;border:0;border-radius:999px;background:#e8590c;color:#fff;font-weight:700;padding:8px 14px;font-size:14.5px}
.ver-stand{font-size:14.5px;margin:2px 0 6px}
.marke.grau{background:var(--linie);color:var(--text);font-weight:600}
.marke.okmarke{background:var(--ok)}
.marke.warnmarke{background:#e8590c}

/* ---------- Kontakt ---------- */
.kz{display:flex;align-items:center;border-top:1px solid var(--linie)}
.kz:first-of-type{border-top:0}
.kz-link{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 14px;color:inherit;text-decoration:none}
.kz-icon{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--bg)}
.kz-icon.gruen{background:#2f9e44;color:#fff}
.kz-text{flex:1;min-width:0;display:flex;flex-direction:column}
.kz-label{font-size:13px;color:var(--leise)}
.kz-wert{font-weight:600;overflow-wrap:anywhere}
.kz-aktion{flex:none;font-size:14px;font-weight:600;color:var(--link);background:none;border:0;padding:6px}
.kz-aktion.gruen{color:#fff;background:#2f9e44;border-radius:999px;padding:7px 14px}
.mini{border:0;background:none;padding:10px 12px;font-size:18px}
.kundennr{font-size:28px;font-weight:800;letter-spacing:.02em}

/* ---------- Overlay (Hilfe / Info) ---------- */
#overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.blatt{position:relative;background:var(--karte);width:100%;max-width:640px;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 22px)}
@media (min-width:700px){ #overlay{align-items:center} .blatt{border-radius:20px} }
.blatt h2{margin:0 40px 10px 0;font-size:21px}
.blatt .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);font-size:16px}
.blatt details{border-top:1px solid var(--linie);padding:4px 0}
.blatt summary{padding:10px 0;font-weight:650;cursor:pointer}
.blatt details p{margin:0 0 10px;font-size:15px}
.blatt .knopf{margin-top:14px}
.credit{margin-top:18px;padding-top:12px;border-top:1px solid var(--linie);font-size:14px;color:var(--leise);text-align:center}
#verNeu{padding-left:20px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);z-index:60;
  background:#1f2937;color:#fff;border-radius:12px;padding:10px 16px;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.25);margin-bottom:84px;
  max-width:90vw;transition:opacity .25s;pointer-events:none}

/* ---------- Druck ---------- */
#druck{display:none}
@media print{
  @page{size:A4;margin:14mm 14mm 16mm}
  html,body{background:#fff !important;color:#000 !important;padding:0}
  #kopf,#app,#overlay,.toast{display:none !important}
  #druck{display:block;font:10.5pt/1.35 Arial,Helvetica,sans-serif;color:#000;padding:0 3px 0 1px}
  #druck *{color:#000}
  .d-kopf{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6px}
  .d-titel{font-size:20pt;font-weight:700}
  .d-weg{margin:6px 0 10px;font-weight:700}
  .d-daten{display:flex;gap:16px;margin-bottom:12px}
  .d-daten > div{flex:1;min-width:0;border:1px solid #999;padding:6px 8px}
  .d-daten .t{font-size:8.5pt;text-transform:uppercase;letter-spacing:.04em;color:#444;margin-bottom:3px}
  .d-daten table td{padding:1px 8px 1px 0;vertical-align:top}
  .d-daten table td:first-child{color:#444;white-space:nowrap}
  .d-pos{width:100%;border-collapse:collapse}
  .d-pos th,.d-pos td{border:1px solid #888;padding:4px 6px;vertical-align:top}
  .d-pos th{background:#e9e9e9;font-size:9pt;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .d-pos tr{break-inside:avoid}
  .d-pos .r{text-align:right;white-space:nowrap}
  .d-pos .m{font-weight:700;font-size:12pt;text-align:center}
  .d-klein{font-size:8.5pt;color:#333}
  .d-summe{text-align:right;margin-top:6px;font-weight:700;font-size:12pt}
  .d-summe span{display:block;font-weight:400;font-size:8.5pt}
  .d-bem{margin-top:10px;border:1px solid #999;padding:6px 8px}
  .d-unterschrift{display:flex;gap:40px;margin-top:46px}
  .d-unterschrift div{flex:1;border-top:1px solid #000;padding-top:3px;font-size:9pt}
  .d-fuss{margin-top:18px;font-size:8pt;color:#555}
}
</style>
</head>
<body>
<header id="kopf"></header>
<main id="app"><noscript><p class="leer">Bitte JavaScript aktivieren.</p></noscript></main>
<div id="druck"></div>
<div id="overlay" hidden></div>

<script>
'use strict';
/* =====================================================================
   BESTELLUNGEN – Bestell-App für Lieferanten
   ---------------------------------------------------------------------
   Aufbau dieser Datei:
     1. Version & Neuerungen
     2. Firmen-Daten (Kontakt, Kopfdaten, Produkte)  ← neue Firmen hier
     3. Speicher (was auf dem Gerät gemerkt wird)
     4. Hilfsfunktionen
     4b. Abgleich mit dem privaten GitHub-Repo (Preise, Kundennummern, Bestellungen)
     5. Ansichten: Start, Produkte, Bestellzettel, Kontakt
     6. Drucken / E-Mail / Teilen / Abschließen
     7. Hilfe & Info
     8. Bedienung (Antippen, Eingaben) & Start
   ===================================================================== */

/* ---------- 1. Version & Neuerungen ---------- */
const APP_VERSION = '1.4';
const VERSIONEN = [
  { v: '1.4', datum: '09.11.2026', neu: [
    'Neue Version auf GitHub? Oben erscheint „Version … ist da“ mit „Jetzt laden“ – geprüft beim Öffnen der App und alle 10 Minuten',
    'ℹ-Fenster zeigt, ob deine Version aktuell ist',
    'Hat das andere Gerät schon eine neuere Version abgeglichen, meldet sich dieses Gerät beim nächsten Abgleich ebenfalls',
  ]},
  { v: '1.3', datum: '09.11.2026', neu: [
    'ℹ-Fenster zeigt jetzt direkt die Versionen mit ihren Neuerungen (Auswahl je Version)',
    'Entwickler-Hinweis steht direkt im ℹ-Fenster',
  ]},
  { v: '1.2', datum: '09.11.2026', neu: [
    'Preise, Kundennummern und Konditionen stehen nicht mehr in der App, sondern nur in deinem privaten GitHub-Repo (stammdaten.json)',
    'Abgleich mit GitHub: Mengen, eigene Preise, Kopfdaten und frühere Bestellungen sind auf iPhone und iPad gleich – die neuere Änderung gewinnt',
    'Gelöschte frühere Bestellungen verschwinden auch auf dem anderen Gerät',
    'Sicherheitssperre: Die App verbindet sich nur mit einem privaten Repo',
    'Startseite zeigt den Stand des Abgleichs; Hilfe mit Anleitung „Abgleich einrichten“',
  ]},
  { v: '1.1', datum: '09.11.2026', neu: [
    'Preise änderbar unter „Bearbeiten“ – auch für Weber (leer = Listenpreis)',
    'Mindestbestellwert je Firma (in den Kopfdaten) mit Anzeige „noch … € bis zum Mindestwert“',
    'Summenleiste unten in der Produktliste',

}

/* Stammdaten aus dem privaten Repo (Preise, Kundennummern, Kopfdaten) – auf dem Gerät zwischengespeichert */
const STAMM_KEY = 'bestellungen.stamm';
let STAMM = null;
try { STAMM = JSON.parse(localStorage.getItem(STAMM_KEY) || 'null'); } catch (e) { STAMM = null; }
const stammFirma = f => (STAMM && STAMM.firmen && STAMM.firmen[f.id]) || {};
function listenPreis(f, a) { const p = (stammFirma(f).preise || {})[a.nr]; return Array.isArray(p) ? { ppe: p[0], pvpe: p[1] } : {}; }
const hinweisVon = (f, a) => (stammFirma(f).hinweise || {})[a.nr] || '';
const preisHinweisVon = f => stammFirma(f).preisHinweis || '';

/* Preis je Bestelleinheit: eigener Preis (falls eingetragen), sonst Listenpreis, sonst null */
function preisVpe(f, a) {
  const p = (S.preise[f.id] || {})[a.nr];
  if (typeof p === 'number') return p;
  const lp = listenPreis(f, a).pvpe;
  return typeof lp === 'number' ? lp : null;
}
const preisGeaendert = (f, a) => typeof (S.preise[f.id] || {})[a.nr] === 'number';
function setPreis(f, nr, text) {
  const a = artikelNr(f, nr); if (!a) return;
  const v = parseZahl(text), pp = (S.preise[f.id] ||= {});
  const lp = listenPreis(f, a).pvpe;
  if (!(v >= 0) || (typeof lp === 'number' && Math.abs(v - lp) < 0.005)) delete pp[nr];
  else pp[nr] = Math.round(v * 100) / 100;
  speichern();
}
const summe = f => positionen(f).reduce((s, { a, m }) => s + (preisVpe(f, a) || 0) * m, 0);
const hatPreise = f => positionen(f).some(({ a }) => preisVpe(f, a) !== null);
/* „1.234,56 €“ → 1234.56 */
function parseZahl(t) {
  const s = String(t ?? '').trim().replace(/[\s€]/g, '').replace(/\.(?=\d{3}(\D|$))/g, '').replace(',', '.');
  return s === '' ? NaN : Number(s);
}
const zahlDe = n => n.toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function mindestwert(f) { const v = parseZahl(kopfDaten(f).mindestwert); return v > 0 ? v : 0; }
const einheitEinzahl = (f, a) => f.mitVpe ? 'VPE' : (a.einheit || 'Karton');
const heuteIso = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };

const wegName = w => (WEGE.find(([id]) => id === w) || [])[2] || '';
const wegText = w => { const x = WEGE.find(([id]) => id === w); return x ? x[1] + ' ' + x[2] : ''; };

function kopfDaten(f) {
  const k = Object.assign({ besteller: '', telefon: '', mindestwert: '', liefertermin: '', bemerkung: '' }, stammFirma(f).kopf || {}, S.kopf[f.id] || {});
  if (!k.besteller && S.letzterBesteller) k.besteller = S.letzterBesteller;
  return k;
}
/* „6 × 1 l Flasche“ bzw. „Karton à 2.000 Stück“ */
function gebindeText(f, a) {
  if (f.mitVpe) return (a.vpe > 1 ? a.vpe + ' × ' : '') + a.inh + ' ' + a.geb;
  return a.einheit === 'Rolle' ? 'je Rolle' : 'Karton à ' + a.inh;
}
/* Einheit der Bestellmenge: VPE bzw. Karton/Kartons, Rolle/Rollen */
function einheit(f, a, m) {
  if (f.mitVpe) return 'VPE';
  const e = a.einheit || 'Karton';
  if (m === 1) return e;
  return e === 'Rolle' ? 'Rollen' : e + 's';
}

function setMenge(f, nr, m) {
  m = Math.max(0, Math.min(999, Math.round(Number(m) || 0)));
  const mm = (S.mengen[f.id] ||= {});
  if (m) mm[nr] = m; else delete mm[nr];
  speichern();
  nachMengenAenderung(f, nr);
}
function setSichtbar(f, nr, sichtbar) {
  const s = ausgeblendet(f);
  if (sichtbar) s.delete(nr); else s.add(nr);
  S.aus[f.id] = [...s];
  speichern();
}

let toastTimer;
function toast(text) {
  let t = $('.toast');
  if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t); }
  t.textContent = text; t.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.style.opacity = '0'; }, 2200);
}

   • bestellungen-daten.json – Mengen, eigene Preise, Kopfdaten-Änderungen, frühere Bestellungen …
                               (schreibt die App selbst; die neuere Änderung gewinnt)
   Der Schlüssel bleibt nur auf diesem Gerät. Hochgeladen wird nur nach erfolgreichem Abruf. */
const STAMM_DATEI = 'stammdaten.json', DATEN_DATEI = 'bestellungen-daten.json';
const TEILE = ['mengen', 'aus', 'kopf', 'preise', 'kontaktExtra'];
const GLOBAL = ['letzterWeg', 'letzterBesteller'];
const sySave = () => { try { localStorage.setItem(SYNC_KEY, JSON.stringify(SY)); } catch (e) { /* egal */ } };
const syAktiv = () => !!(SY.token && SY.owner && SY.repo);
const geraetName = () => (/iPad/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1))
  ? 'iPad' : /iPhone/.test(navigator.userAgent) ? 'iPhone' : 'Computer';
function zeitText(ms) {
  const d = new Date(ms), heute = new Date().toDateString() === d.toDateString();
  const uhr = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
  return heute ? 'heute ' + uhr : d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' }) + '. ' + uhr;
}
/* Vergleich unabhängig von der Reihenfolge */
function sortiert(v) {
  if (Array.isArray(v)) return v.map(sortiert);
  if (v && typeof v === 'object') { const o = {}; for (const k of Object.keys(v).sort()) o[k] = sortiert(v[k]); return o; }
  return v === undefined ? null : v;
}
const canon = v => JSON.stringify(sortiert(v));
const histSort = (x, y) => (y.iso || '').localeCompare(x.iso || '') || (y.id - x.id);

/* Merkt sich, wann welcher Teil (je Firma) zuletzt geändert wurde */
function schnappschuss() {
  const m = {};
  for (const t of TEILE)
    for (const id of new Set([...FIRMEN.map(f => f.id), ...Object.keys(S[t] || {})])) m[t + '|' + id] = canon((S[t] || {})[id]);
  for (const g of GLOBAL) m[g] = canon(S[g]);
  return m;
}
function track() {
  const neu = schnappschuss(), jetzt = Date.now();
  S.zeit = S.zeit || {};
  if (SNAP) for (const k in neu) if (neu[k] !== SNAP[k]) S.zeit[k] = jetzt;
  SNAP = neu;
}
function syncDaten() {
  const d = { app: 'bestellungen', format: 1, zeit: S.zeit || {}, historie: S.historie || {}, geloescht: S.geloescht || [] };
  for (const t of TEILE) d[t] = S[t] || {};
  for (const g of GLOBAL) d[g] = S[g];
  return d;
}
/* Zwei Stände zusammenführen: je Teil gewinnt die neuere Änderung;
   frühere Bestellungen werden vereinigt, gelöschte bleiben gelöscht */
function mergeSync(L, R) {
  const LZ = L.zeit || {}, RZ = R.zeit || {}, out = { app: 'bestellungen', format: 1, zeit: {} };
  const waehle = (k, lv, rv) => {
    const tl = LZ[k] || 0, tr = RZ[k] || 0, z = Math.max(tl, tr);
    if (z) out.zeit[k] = z;
    return tr > tl ? rv : tl > tr ? lv : (lv !== undefined ? lv : rv);
  };
  for (const t of TEILE) {
    out[t] = {};
    const lt = L[t] || {}, rt = R[t] || {};
    for (const id of new Set([...Object.keys(lt), ...Object.keys(rt)])) {
      const v = waehle(t + '|' + id, lt[id], rt[id]);
      if (v !== undefined && v !== null) out[t][id] = v;
    }
  }
  for (const g of GLOBAL) { const v = waehle(g, L[g], R[g]); if (v !== undefined && v !== null) out[g] = v; }
  const weg = new Set([...(L.geloescht || []), ...(R.geloescht || [])].map(String));
  out.geloescht = [...weg].slice(-500);
  out.historie = {};
  const lh = L.historie || {}, rh = R.historie || {};
  for (const id of new Set([...Object.keys(lh), ...Object.keys(rh)])) {
    const m = new Map();
    for (const h of [...(rh[id] || []), ...(lh[id] || [])]) if (h && !weg.has(String(h.id))) m.set(String(h.id), h);
    const liste = [...m.values()].sort(histSort).slice(0, 60);
    if (liste.length) out.historie[id] = liste;
  }
  return out;
}
const inhalt = d => { const n = mergeSync(d, d); return canon([TEILE.map(t => n[t]), GLOBAL.map(g => n[g] ?? null), n.historie, n.geloescht, n.zeit]); };
function applySync(m) {
  for (const t of TEILE) S[t] = m[t] || {};
  S.letzterWeg = m.letzterWeg || {}; S.letzterBesteller = m.letzterBesteller || '';
  S.historie = m.historie || {}; S.geloescht = m.geloescht || []; S.zeit = m.zeit || {};
  try { localStorage.setItem(SPEICHER_KEY, JSON.stringify(S)); } catch (e) { /* egal */ }
  SNAP = schnappschuss();
}

/* GitHub-Zugriff */
function b64enc(str) {
  const b = new TextEncoder().encode(str); let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
function b64dec(b64) {
  const bin = atob(String(b64).replace(/\s/g, '')), b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(b);
}
async function gh(method, datei, body) {
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 20000);
  const url = `https://api.github.com/repos/${encodeURIComponent(SY.owner)}/${encodeURIComponent(SY.repo)}` + (datei ? '/contents/' + encodeURIComponent(datei) : '');
  try {
    return await fetch(url, { method, cache: 'no-store', signal: ctl.signal,
      headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + SY.token, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined });
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'GitHub antwortet nicht (Zeitüberschreitung)' : 'Keine Verbindung – Internet prüfen');
  } finally { clearTimeout(timer); }
}
function ghFehler(r) {
  if (r.status === 401) return new Error('Schlüssel ungültig oder abgelaufen – neuen Schlüssel erstellen');
  if (r.status === 403) return new Error('Kein Zugriff – beim Schlüssel „Contents: Read and write“ für dieses Repo prüfen');
  if (r.status === 429) return new Error('GitHub-Limit erreicht – gleich nochmal versuchen');
  if (r.status === 404) return new Error('Repo nicht gefunden – Name prüfen, und ob der Schlüssel Zugriff auf dieses Repo hat');
  return new Error('GitHub antwortet mit Fehler ' + r.status);
}
async function ghLesen(datei) {
  const r = await gh('GET', datei);
  if (r.status === 404) return { sha: null, data: null };
  if (!r.ok) throw ghFehler(r);
  const j = await r.json();
  try { return { sha: j.sha, data: JSON.parse(b64dec(j.content)) }; }
  catch (e) { throw new Error(datei + ' im Repo ist beschädigt (kein gültiges JSON)'); }
}
async function ghSchreiben(datei, data, sha) {
  const r = await gh('PUT', datei, { message: `Abgleich ${geraetName()} ${new Date().toLocaleString('de-DE')}`,
    content: b64enc(JSON.stringify(data, null, 1)), ...(sha ? { sha } : {}) });
  if (r.status === 409 || r.status === 422) return false;   /* jemand war schneller → nochmal */
  if (!r.ok) throw ghFehler(r);
  return true;
}
function syLog(text) { SY.verlauf = [{ t: Date.now(), text }, ...(SY.verlauf || [])].slice(0, 15); }
function syncBald() { if (!syAktiv()) return; clearTimeout(syTimer); syTimer = setTimeout(() => syncJetzt(false), 3000); }
const eingabeAktiv = () => { const a = document.activeElement; return !!a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && $('#app').contains(a); };

async function syncJetzt(vonHand) {
  if (!syAktiv()) return false;
  if (syLaeuft) { syNochmal = true; return false; }
  syLaeuft = true; renderSyncAnzeige();
  let zeichnen = false, ok = false;
  try {
    /* 1. Stammdaten holen */
    const st = await ghLesen(STAMM_DATEI);
    if (st.data) {
      if (st.data.app !== 'bestellungen-stammdaten') throw new Error('stammdaten.json passt nicht zu dieser App');
      if (canon(st.data) !== canon(STAMM)) {
        STAMM = st.data; zeichnen = true;
        try { localStorage.setItem(STAMM_KEY, JSON.stringify(STAMM)); } catch (e) { /* egal */ }
      }
    } else if (!STAMM) syLog('Hinweis: stammdaten.json fehlt im Repo');
    /* 2. Eigene Daten abgleichen */
    for (let versuch = 1; ; versuch++) {
      const r = await ghLesen(DATEN_DATEI);
      if (r.data && r.data.app !== 'bestellungen') throw new Error('bestellungen-daten.json gehört nicht zu dieser App – nichts überschrieben');
      if (r.data) neueVersionMelden(r.data.appVersion);
      const lokal = syncDaten(), m = mergeSync(lokal, r.data || lokal);
      if (inhalt(m) !== inhalt(lokal)) { applySync(m); zeichnen = true; }
      if (!r.data || inhalt(m) !== inhalt(r.data)) {
        const geschrieben = await ghSchreiben(DATEN_DATEI, Object.assign({}, m, { geraet: geraetName(), appVersion: APP_VERSION, gespeichert: new Date().toISOString() }), r.sha);
        if (!geschrieben) { if (versuch < 3) continue; throw new Error('Gleichzeitige Änderung auf GitHub – bitte gleich nochmal'); }
      }
      break;
    }
    SY.zuletzt = Date.now(); SY.fehler = ''; ok = true;
    syLog(vonHand ? '✓ abgeglichen (von Hand)' : '✓ abgeglichen');
  } catch (e) {
    SY.fehler = e.message || String(e); syLog('✗ ' + SY.fehler);
  } finally {
    syLaeuft = false; sySave();
    if (zeichnen) { if (eingabeAktiv()) UI.spaeterZeichnen = true; else neuZeichnen(); }
    renderSyncAnzeige();
    if (syNochmal) { syNochmal = false; syncBald(); }
  }
  return ok;
}
async function verbinden() {
  const owner = $('#sy-owner').value.trim(), repo = $('#sy-repo').value.trim(), token = $('#sy-token').value.trim();
  if (!owner || !repo || !token) { zeigeOverlay(syncHtml('Bitte alle drei Felder ausfüllen.')); return; }
  const knopf = $('[data-akt=verbinden]');
  if (knopf) { knopf.disabled = true; knopf.textContent = 'Verbinde …'; }
  const vorher = SY;
  SY = Object.assign({}, SY, { owner, repo, token, fehler: '' });
  try {
    const r = await gh('GET', '');
    if (!r.ok) throw ghFehler(r);
    const info = await r.json();
    if (info.private !== true) throw new Error('Dieses Repo ist öffentlich! Preise und Kundennummern wären für alle sichtbar – bitte ein privates Repo nehmen.');
    syLog('Verbunden mit ' + owner + '/' + repo);
    sySave();
    await syncJetzt(true);
    zeigeOverlay(syncHtml());
    if (!SY.fehler) toast(STAMM ? 'Verbunden – Preise geladen ✓' : 'Verbunden ✓');
  } catch (e) {
    SY = Object.assign({}, vorher, { owner, repo, token: '' }); sySave();
    zeigeOverlay(syncHtml(e.message || String(e)));
  }
}
function syncStatusText() {
  if (syLaeuft) return 'gleicht ab …';
  if (SY.fehler) return '⚠ ' + SY.fehler;
  return SY.zuletzt ? 'abgeglichen ' + zeitText(SY.zuletzt) : 'noch nicht abgeglichen';
}
function syncZeileHtml() {
  if (!syAktiv()) return `<button class="sync-zeile" data-akt="abgleich">☁️ Abgleich mit GitHub einrichten</button>`;
  return `<button class="sync-zeile ${SY.fehler && !syLaeuft ? 'fehler' : ''}" data-akt="abgleich">☁️ ${esc(syncStatusText())}</button>`;
}
function syncHtml(meldung) {
  const kopf = `<h2>☁️ Abgleich mit GitHub</h2>`;
  if (!syAktiv()) return `<div id="syncBlatt">${kopf}
    <p class="klein">Preise, Kundennummern und deine Bestellungen liegen in deinem <b>privaten</b> GitHub-Repo. Nur Geräte mit dem Schlüssel kommen dran – und iPhone und iPad haben denselben Stand.</p>
    <label class="feld"><span>GitHub-Name</span><input id="sy-owner" value="${esc(SY.owner || '1965-chris')}" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label class="feld"><span>Privates Repo</span><input id="sy-repo" value="${esc(SY.repo || 'Bestellungen-Daten')}" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
    <label class="feld"><span>Schlüssel (Token)</span><input id="sy-token" type="password" autocomplete="off" autocapitalize="off" placeholder="github_pat_…"></label>
    ${meldung ? `<div class="warn sy-meldung">⚠ ${esc(meldung)}</div>` : ''}
    <button class="knopf haupt" data-akt="verbinden" style="margin-top:14px">Verbinden</button>
    <p class="leise klein">Anleitung: ℹ Hilfe › „☁️ Abgleich einrichten“</p></div>`;
  const verlauf = (SY.verlauf || []).map(v => `<li>${esc(zeitText(v.t))} – ${esc(v.text)}</li>`).join('');
  return `<div id="syncBlatt">${kopf}
    <div class="sy-info">
      <div>Repo: <b>${esc(SY.owner)}/${esc(SY.repo)}</b> (privat)</div>
      <div>Status: <b>${esc(syncStatusText())}</b></div>
      <div>Preisliste: <b>${STAMM ? 'Stand ' + esc(STAMM.stand || '?') : '⚠ fehlt – stammdaten.json ins Repo hochladen'}</b></div>
      <div>Dieses Gerät: ${esc(geraetName())}</div>
    </div>
    <button class="knopf haupt" data-akt="syncJetzt" style="margin-top:14px" ${syLaeuft ? 'disabled' : ''}>🔄 Jetzt abgleichen</button>
    ${verlauf ? `<details class="sy-verlauf"><summary>Verlauf</summary><ul>${verlauf}</ul></details>` : ''}
    <button class="link rot" data-akt="trennen" style="margin-top:12px">Verbindung auf diesem Gerät trennen</button></div>`;
}
function renderSyncAnzeige() {
  const z = $('#syncZeile'); if (z) z.innerHTML = syncZeileHtml();
  if ($('#syncBlatt') && !$('#overlay').hidden && !$('#overlay').contains(document.activeElement)) zeigeOverlay(syncHtml());
}

/* ---------- 4c. Neue App-Version? ----------
   Holt die index.html frisch von GitHub und liest dort APP_VERSION.
   Ist sie neuer, erscheint oben „Version … ist da – Jetzt laden“. */
const versionZahl = v => { const m = /(\d+)\.(\d+)/.exec(v || ''); return m ? +m[1] * 1000 + +m[2] : 0; };
let updateGeprueft = 0;
async function neuesteVersion() {
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) return null;
    const m = /const APP_VERSION = '([^']+)'/.exec(await r.text());
    return m ? m[1] : null;
  } catch (e) { return null; }
}
function neueVersionMelden(v) {
  if (!v || versionZahl(v) <= versionZahl(APP_VERSION) || versionZahl(v) <= versionZahl(UI.neueVersion)) return;
  UI.neueVersion = v;
  renderKopf();
}
async function updatePruefen(sofort) {
  if (!sofort && Date.now() - updateGeprueft < 10 * 60 * 1000) return null;
  updateGeprueft = Date.now();
  const v = await neuesteVersion();
  neueVersionMelden(v);
  return v;
}
async function neuLaden() {
  const k = $('.update-knopf'); if (k) { k.disabled = true; k.textContent = 'Lädt …'; }
  /* frische Fassung in den Zwischenspeicher holen, dann neu laden */
  try { await fetch(location.pathname, { cache: 'reload' }); } catch (e) { /* egal */ }
  location.reload();
}

/* ---------- 5. Ansichten ---------- */
function renderKopf() {

  document.documentElement.style.setProperty('--akzent', f ? f.farbe : '#1f2937');
  if (window.matchMedia && !matchMedia('(prefers-color-scheme: dark)').matches)
    document.documentElement.style.setProperty('--link', f ? f.farbe : '#1f2937');
  const n = f ? positionen(f).length : 0;
  $('#kopf').innerHTML = `
    <div class="kopf-zeile">
      ${f ? `<button class="rund zurueck" data-akt="heim" aria-label="Zurück zur Übersicht">‹</button>` : ''}

    </div>
    ${f ? `<nav class="reiter">

    </nav>` : ''}

}

function render() {

  const f = UI.firma, app = $('#app');

  else if (UI.reiter === 'kontakt') app.innerHTML = kontaktHtml(f);
  else { app.innerHTML = produkteHtml(f); renderListe(); }
}
function neuZeichnen() { const y = window.scrollY; render(); window.scrollTo(0, y); }

/* Startseite */

/* Summenleiste unten in der Produktliste */
function leisteHtml(f) {

  const sum = summe(f), min = mindestwert(f), hatP = hatPreise(f), ok = hatP && min && sum >= min;
  const status = hatP && min ? (ok ? '✓ Mindestbestellwert erreicht' : `noch ${eur(min - sum)} bis ${eur(min)}`) : '';
  return `<a class="leiste ${ok ? 'ok' : ''}" href="#/${f.id}/bestellung">

function renderListe() {

function gruppenHtml(f, arts, aus, bearb) {

function stepperHtml(nr, m) {

function ablegen(f) {
  const pos = positionen(f);
  if (!pos.length) { schliesseOverlay(); toast('Der Bestellzettel ist leer.'); return; }
  const weg = ($('input[name=weg]:checked') || {}).value || 'telefon';
  const iso = $('#ab-datum').value || heuteIso();
  const k = kopfDaten(f);
  const eintrag = {
    id: Date.now(), iso, datum: isoZuDe(iso),
    zeit: iso === heuteIso() ? new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }) : '',
    weg, partner: weg === 'telefon' ? $('#ab-partner').value.trim() : '', notiz: $('#ab-notiz').value.trim(),
    besteller: k.besteller, posten: pos.map(({ a, m }) => ({ nr: a.nr, m, p: preisVpe(f, a) })), summe: summe(f),
  };
  S.historie[f.id] = [eintrag, ...(S.historie[f.id] || [])]
    .sort(histSort).slice(0, 60);
  S.letzterWeg[f.id] = weg;
  S.mengen[f.id] = {};
  const kk = S.kopf[f.id] || {}; delete kk.liefertermin; delete kk.bemerkung; S.kopf[f.id] = kk;
  speichern();
  schliesseOverlay();
  UI.histOffen = true;
  neuZeichnen();
  toast('Bestellung abgelegt ✓');
}
function histUebernehmen(f, id) {
  const h = (S.historie[f.id] || []).find(x => String(x.id) === String(id));
  if (!h) return;
  if (positionen(f).length && !confirm('Der aktuelle Bestellzettel wird ersetzt. Weiter?')) return;
  const mm = {};
  for (const p of h.posten) if (artikelNr(f, p.nr)) mm[p.nr] = p.m;
  S.mengen[f.id] = mm;
  speichern(); neuZeichnen(); window.scrollTo(0, 0);
  toast('Bestellung vom ' + h.datum + ' übernommen');
}

    <h2>ℹ Hilfe</h2>
    <details open><summary>Wozu die App?</summary>
      <p>Bestellung vorbereiten, beim Bestellen (Telefon, Fax, MDE) als Vorlage nutzen und danach ablegen – so siehst du später, wann, wie und mit wem bestellt wurde.</p></details>
    <details><summary>Startseite</summary>
      <p>Jede Kachel ist ein Lieferant. Die farbige Zahl zeigt, wie viele Positionen gerade im Bestellzettel stehen, darunter steht die letzte Bestellung.</p></details>
    <details><summary>Produkte & Mengen</summary>
      <p>Kategorien antippen zum Auf- und Zuklappen. Mit <b>+</b> und <b>−</b> trägst du die Bestellmenge ein – bei Remsgold in VPE (Verpackungseinheiten), bei Weber in Kartons bzw. Rollen. Die Zahl kannst du auch direkt eintippen.</p>
      <p>Unten erscheint eine Leiste mit Positionen, Summe und dem Stand zum Mindestbestellwert. Antippen öffnet den Bestellzettel.</p>
      <p>Die Suche findet Namen und Artikelnummern – auch von ausgeblendeten Produkten.</p></details>
    <details><summary>Bearbeiten: ausblenden & Preise</summary>
      <p><b>Bearbeiten</b> antippen: Jedes Produkt bekommt einen Schalter und ein Preisfeld. Schalter aus = Produkt verschwindet aus der Liste. Je Kategorie gibt es „alle einblenden“ / „alle ausblenden“.</p>
      <p>Preis ändern: einfach die neue Zahl eintippen. Feld leeren = wieder der Preis aus der Liste. Bei Weber kannst du so eigene Preise eintragen. Mit <b>Fertig</b> zurück.</p></details>
    <details><summary>Mindestbestellwert</summary>
      <p>Im Bestellzettel unter <b>Kopfdaten</b> den Mindestbestellwert eintragen. Dann zeigt die App „noch … € bis zum Mindestbestellwert“ bzw. „✓ erreicht“.</p></details>
    <details><summary>Bestellzettel</summary>
      <p>Hier steht alles mit Menge. Die Kopfdaten füllst du einmal aus, sie werden gemerkt. Liefertermin und Bemerkung gelten nur für die aktuelle Bestellung.</p>
      <p><b>📞 Anrufen</b> wählt direkt den Lieferanten. <b>🖨 Drucken</b> erstellt den Bestellzettel zum Faxen – im Druckdialog kannst du ihn auch als PDF sichern.</p></details>
    <details><summary>Bestellt – ablegen</summary>
      <p>Nach dem Bestellen <b>✓ Bestellt – ablegen</b> antippen und angeben, wie bestellt wurde: Telefon (mit Gesprächspartner/in), Fax, MDE oder E-Mail. Dazu Datum und eine Notiz, z. B. „Lieferung Donnerstag zugesagt“. Danach ist der Bestellzettel wieder leer.</p>
      <p>Unter <b>Frühere Bestellungen</b> siehst du alles wieder (antippen zum Aufklappen) und kannst eine Bestellung erneut übernehmen.</p></details>
    <details><summary>Kontakt</summary>
      <p>Telefonnummer antippen = anrufen. Faxnummern und die Kundennummer kannst du kopieren, die Anschrift öffnet die Karte. Eigene Kontakte (z. B. Außendienst) fügst du unten hinzu.</p></details>
    <details><summary>⚠ Orange Hinweise</summary>
      <p>Hier war auf dem Foto der Preisliste ein Wert unklar oder passte rechnerisch nicht. Bitte mit der Papierliste vergleichen. Sobald du den Preis unter „Bearbeiten“ korrigierst, verschwindet der Hinweis.</p></details>
    <details><summary>☁️ Abgleich einrichten</summary>
      <p>Preise, Kundennummern und deine Bestellungen liegen in deinem <b>privaten</b> GitHub-Repo „Bestellungen-Daten“ – nicht in der App selbst. So sieht sie niemand sonst.</p>
      <p>1. Auf github.com ein neues Repo „Bestellungen-Daten“ anlegen, <b>Private</b> wählen, die Datei stammdaten.json hochladen.<br>
      2. Profilbild › Settings › Developer settings › Personal access tokens › <b>Fine-grained tokens</b> › „Generate new token“: Repository access „Only select repositories“ › Bestellungen-Daten; bei Permissions <b>Contents: Read and write</b>. Schlüssel kopieren – er wird nur einmal angezeigt.<br>
      3. Hier auf der Startseite ☁️ antippen, Schlüssel einfügen, „Verbinden“.<br>
      4. Auf dem iPad dasselbe eintragen – fertig, beide Geräte haben denselben Stand.</p>
      <p>Der Abgleich läuft danach von selbst: beim Öffnen der App und kurz nach jeder Änderung. Bei gleichzeitigen Änderungen gewinnt die neuere.</p></details>
    <details><summary>🔄 Neue Version</summary>
      <p>Liegt auf GitHub eine neuere Version der App, erscheint oben der Hinweis „Version … ist da“. Einfach <b>Jetzt laden</b> antippen – deine Daten bleiben erhalten. Geprüft wird beim Öffnen der App und alle 10 Minuten; im ℹ-Fenster steht, ob deine Version aktuell ist.</p></details>
    <details><summary>Wo sind meine Daten?</summary>
      <p>Auf dem Gerät – und, wenn der Abgleich eingerichtet ist, zusätzlich in deinem privaten Repo (Datei bestellungen-daten.json). Der Schlüssel bleibt nur auf dem Gerät. Die App verbindet sich nur mit einem privaten Repo.</p></details>
    <details open class="versionen"><summary>📋 Versionen & Neuerungen</summary>
      <div class="ver-stand">Deine Version: <b>${APP_VERSION}</b> <span id="verStand" class="marke grau">prüfe …</span></div>
      <div id="verUpdate"></div>
      <label class="feld" style="margin-top:0"><span>Neuerungen anzeigen für Version</span>
        <select id="verSel">${VERSIONEN.map(x => `<option value="${x.v}">${x.v} – ${x.datum}${x.v === APP_VERSION ? ' (aktuell)' : ''}</option>`).join('')}</select></label>
      <ul id="verNeu">${neuerungenHtml(APP_VERSION)}</ul></details>
    <p class="credit"><b>Bestellungen</b> · Version ${APP_VERSION}<br>Entwickelt von Christian Mättig in Kooperation mit Claude (Anthropic)</p>`;
}
async function verStandZeigen() {
  const v = await updatePruefen(true), st = $('#verStand'), up = $('#verUpdate');
  if (!st) return;
  if (!v) { st.textContent = 'offline – nicht geprüft'; return; }
  if (versionZahl(v) > versionZahl(APP_VERSION)) {
    st.textContent = 'veraltet'; st.className = 'marke warnmarke';
    if (up) up.innerHTML = `<div class="update-leiste innen"><span>Version <b>${esc(v)}</b> ist da.</span><button class="update-knopf" data-akt="neuLaden">Jetzt laden</button></div>`;
  } else { st.textContent = '✓ aktuell'; st.className = 'marke okmarke'; }
}
function neuerungenHtml(v) {
  const ver = VERSIONEN.find(x => x.v === v) || VERSIONEN[0];
  return ver.neu.map(n => `<li>${esc(n)}</li>`).join('');
}
function zeigeOverlay(html) {
  const o = $('#overlay');
  o.innerHTML = `<div class="blatt" role="dialog" aria-modal="true"><button class="x" data-akt="schliessen" aria-label="Schließen">✕</button>${html}</div>`;
  o.hidden = false;
  document.body.classList.add('modal');
}
function schliesseOverlay() { $('#overlay').hidden = true; document.body.classList.remove('modal'); }

/* ---------- 8. Bedienung & Start ---------- */
document.addEventListener('click', e => {
  if (e.target.id === 'overlay') { schliesseOverlay(); return; }
  const el = e.target.closest('[data-akt]');
  if (!el) return;
  const f = UI.firma, akt = el.dataset.akt;
  switch (akt) {
    case 'heim': location.hash = '#/'; break;
    case 'firma': location.hash = '#/' + el.dataset.id + '/produkte'; break;
    case 'plus': setMenge(f, el.dataset.nr, menge(f, el.dataset.nr) + 1); break;
    case 'minus': setMenge(f, el.dataset.nr, menge(f, el.dataset.nr) - 1); break;
    case 'kat': {
      const sec = el.closest('.kat'), offen = !sec.classList.contains('offen');
      sec.classList.toggle('offen', offen);
      if (!UI.suche.trim()) { S.offen[f.id + '|' + el.dataset.kat] = offen; speichern(); }
      break;
    }
    case 'alleKat': {
      const ks = kategorien(f), alleOffen = ks.every(k => S.offen[f.id + '|' + k]);
      ks.forEach(k => { S.offen[f.id + '|' + k] = !alleOffen; });
      speichern(); renderListe();
      break;
    }
    case 'bearbeiten': UI.bearbeiten = !UI.bearbeiten; neuZeichnen(); break;
    case 'katAn': case 'katAus':
      f.artikel.filter(a => a.k === el.dataset.kat).forEach(a => setSichtbar(f, a.nr, akt === 'katAn'));
      renderListe();
      break;
    case 'klapp': {
      const sec = el.closest('.klapp'), offen = !sec.classList.contains('offen');
      sec.classList.toggle('offen', offen);
      if (sec.dataset.merk) UI[sec.dataset.merk] = offen;
      break;
    }
    case 'drucken': drucken(f); break;
    case 'mail': location.href = mailHref(f); break;
    case 'teilen': teilen(f); break;
    case 'ablegen':
      if (!positionen(f).length) { toast('Der Bestellzettel ist leer.'); break; }
      zeigeOverlay(ablegenHtml(f));
      break;
    case 'ablegenOk': ablegen(f); break;
    case 'leeren':
      if (confirm('Bestellzettel wirklich leeren?')) { S.mengen[f.id] = {}; speichern(); neuZeichnen(); }
      break;
    case 'histUebernehmen': histUebernehmen(f, el.dataset.id); break;
    case 'histLoeschen':
      if (confirm('Diese frühere Bestellung löschen?')) {
        S.historie[f.id] = (S.historie[f.id] || []).filter(h => String(h.id) !== el.dataset.id);
        (S.geloescht ||= []).push(String(el.dataset.id));
        speichern(); neuZeichnen();
      }
      break;
    case 'kopieren': {
      const w = el.dataset.wert;
      if (navigator.clipboard) navigator.clipboard.writeText(w).then(() => toast('Kopiert: ' + w), () => toast(w));
      else toast(w);
      break;
    }
    case 'kontaktNeu': {
      const typ = $('#nk-typ').value, label = $('#nk-label').value.trim(), wert = $('#nk-wert').value.trim();
      if (!wert) { toast('Bitte Nummer, Adresse oder Text eintragen.'); return; }
      const namen = { tel: 'Telefon', mobil: 'Mobil', fax: 'Fax', mail: 'E-Mail', notiz: 'Notiz' };
      (S.kontaktExtra[f.id] ||= []).push({ typ, label: label || namen[typ], wert });
      speichern(); UI.neuOffen = false; neuZeichnen(); toast('Kontakt gespeichert');
      break;
    }
    case 'kontaktLoeschen': {
      const liste = S.kontaktExtra[f.id] || [], i = Number(el.dataset.i);
      if (liste[i] && confirm(`„${liste[i].label}“ löschen?`)) { liste.splice(i, 1); speichern(); neuZeichnen(); }
      break;
    }
    case 'abgleich': zeigeOverlay(syncHtml()); break;
    case 'verbinden': verbinden(); break;
    case 'syncJetzt': syncJetzt(true); break;
    case 'trennen':
      if (confirm('Verbindung auf diesem Gerät trennen?\n\nDeine Daten bleiben auf dem Gerät. Zum erneuten Verbinden brauchst du den Schlüssel.')) {
        SY = { owner: SY.owner, repo: SY.repo, verlauf: SY.verlauf }; sySave(); zeigeOverlay(syncHtml()); neuZeichnen();
      }
      break;
    case 'hilfe': zeigeOverlay(hilfeHtml()); verStandZeigen(); break;
    case 'neuLaden': neuLaden(); break;
    case 'info': {
      zeigeOverlay(hilfeHtml()); verStandZeigen();
      const v = $('#overlay .versionen'); if (v) v.scrollIntoView({ block: 'start' });
      break;
    }
    case 'schliessen': schliesseOverlay(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target, f = UI.firma;
  if (t.id === 'suche') { UI.suche = t.value; renderListe(); return; }
  if (t.matches('[data-kopf]') && f) {
    (S.kopf[f.id] ||= {})[t.dataset.kopf] = t.value;
    if (t.dataset.kopf === 'besteller') S.letzterBesteller = t.value;
    speichern();
    const sub = $('#kopfSub'); if (sub) sub.innerHTML = kopfSubText(kopfDaten(f));
    const sb = $('#summenBox'); if (sb && t.dataset.kopf === 'mindestwert') sb.innerHTML = summenHtml(f);
  }
});
document.addEventListener('change', e => {
  const t = e.target, f = UI.firma;
  if (t.matches('[data-menge]')) { setMenge(f, t.dataset.nr, t.value); return; }
  if (t.matches('[data-sichtbar]')) {
    setSichtbar(f, t.dataset.nr, t.checked);
    t.closest('.art').classList.toggle('aus', !t.checked);
    return;
  }
  if (t.matches('[data-preis]')) {
    setPreis(f, t.dataset.nr, t.value);
    const p = preisVpe(f, artikelNr(f, t.dataset.nr));
    t.value = p !== null ? zahlDe(p) : '';
    return;
  }
  if (t.name === 'weg') { const pf = $('#partnerFeld'); if (pf) pf.hidden = t.value !== 'telefon'; return; }
  if (t.id === 'verSel') { const l = $('#verNeu'); if (l) l.innerHTML = neuerungenHtml(t.value); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#overlay').hidden) schliesseOverlay(); });
/* Zahlenfeld beim Antippen komplett markieren – so ersetzt die neue Zahl die alte */
document.addEventListener('focusin', e => { if (e.target.matches('[data-menge]')) setTimeout(() => e.target.select(), 0); });

function route() {
  const [id, reiter] = location.hash.replace(/^#\/?/, '').split('/');
  const f = firmaById(id);
  const neueSeite = f !== UI.firma || (reiter || 'produkte') !== UI.reiter;
  if (f !== UI.firma) { UI.bearbeiten = false; UI.suche = ''; UI.kopfOffen = null; UI.histOffen = false; UI.neuOffen = false; }
  UI.firma = f;
  UI.reiter = ['produkte', 'bestellung', 'kontakt'].includes(reiter) ? reiter : 'produkte';
  render();
  if (neueSeite) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
window.addEventListener('storage', e => { if (e.key === SPEICHER_KEY) { S = laden(); SNAP = schnappschuss(); neuZeichnen(); } });
SNAP = schnappschuss();
route();
if (syAktiv()) syncJetzt(false);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (syAktiv() && Date.now() - (SY.zuletzt || 0) > 20000) syncJetzt(false);
  updatePruefen(false);
});
setTimeout(() => updatePruefen(true), 2500);
setInterval(() => { if (document.visibilityState === 'visible') updatePruefen(false); }, 10 * 60 * 1000);
/* Abgleich hat während einer Eingabe etwas geändert → nach der Eingabe neu zeichnen */
document.addEventListener('focusout', () => setTimeout(() => {
  if (UI.spaeterZeichnen && !eingabeAktiv()) { UI.spaeterZeichnen = false; neuZeichnen(); }
}, 80));

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
