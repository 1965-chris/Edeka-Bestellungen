<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bestellungen">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Bestellungen</title>
<style>
:root{
  --bg:#f2f3f6; --karte:#fff; --text:#1b1e23; --leise:#6b7280; --linie:#e4e6ea;
  --akzent:#1f2937; --link:#1f2937; --ok:#2b8a3e; --rot:#c92a2a; --warn:#a85400; --warn-bg:#fff4e6;
  --r:14px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#111316; --karte:#1c1f24; --text:#eceef1; --leise:#9aa1ab; --linie:#2e3239;
         --link:#9db4ff; --warn:#f0a040; --warn-bg:#33270f; --ok:#51cf66; --rot:#ff8787; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}
body.modal{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
[hidden]{display:none !important}

/* ---------- Kopfzeile ---------- */
#kopf{position:sticky;top:0;z-index:20;background:var(--akzent);color:#fff;
  padding-top:env(safe-area-inset-top);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.kopf-zeile{display:flex;align-items:center;gap:6px;min-height:54px;padding:0 10px}
.kopf-titel{flex:1;min-width:0;font-weight:700;font-size:19px;line-height:1.15;padding-left:4px}
.kopf-unter{font-size:12.5px;font-weight:400;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rund{width:40px;height:40px;flex:none;border-radius:50%;border:0;background:rgba(255,255,255,.17);
  color:#fff;font-size:20px;display:grid;place-items:center}
.rund.zurueck{font-size:30px;line-height:1;padding-bottom:4px}
.reiter{display:flex;padding:0 6px}
.reiter a{flex:1;text-align:center;color:#fff;opacity:.72;text-decoration:none;padding:9px 2px 10px;
  font-weight:600;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
.reiter a.aktiv{opacity:1;border-bottom-color:#fff}
.reiter .marke{background:#fff;color:var(--akzent)}

main{max-width:760px;margin:0 auto}

/* ---------- Allgemein ---------- */
.marke{display:inline-block;min-width:22px;text-align:center;background:var(--akzent);color:#fff;
  border-radius:999px;padding:1px 7px;font-size:12.5px;font-weight:700;line-height:1.5}
.karte{background:var(--karte);border-radius:var(--r);margin:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);overflow:hidden}
.karte-inhalt{padding:14px}
.karte h3{margin:0;padding:14px 14px 4px;font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--leise)}
.leise{color:var(--leise)}
.klein{font-size:13.5px}
.leer{text-align:center;color:var(--leise);padding:22px 16px;margin:0}
.link{background:none;border:0;padding:6px 4px;color:var(--link);font-weight:600}
.link.rot{color:var(--rot)}
.knopf{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;
  border-radius:12px;border:1px solid var(--linie);background:var(--karte);font-weight:600;
  text-decoration:none;padding:10px 14px}
a.knopf{color:var(--text)}
a.link{display:inline-block;text-decoration:none}
.knopf.haupt{background:var(--akzent);border-color:var(--akzent);color:#fff}
.knopf.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.knopf.aktiv{background:var(--akzent);border-color:var(--akzent);color:#fff}

/* ---------- Startseite / Kacheln ---------- */
.start-text{margin:18px 16px 4px;color:var(--leise);font-size:15px}
.kacheln{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding:12px 12px 4px}
.kachel{display:flex;flex-direction:column;padding:0;border:0;border-radius:18px;overflow:hidden;text-align:left;
  background:var(--karte);box-shadow:0 1px 3px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.05)}
.kachel:active{transform:scale(.985)}
.band{display:block;height:7px;background:linear-gradient(90deg,var(--f1),var(--f2))}
.k-inhalt{display:flex;align-items:center;gap:14px;padding:16px}
.monogramm{width:58px;height:58px;flex:none;border-radius:16px;background:var(--f1);color:#fff;
  font-weight:800;font-size:28px;display:grid;place-items:center}
.k-text{flex:1;min-width:0;display:flex;flex-direction:column}
.k-name{font-weight:700;font-size:19px}
.k-unter{color:var(--leise);font-size:14px}
.k-info{color:var(--leise);font-size:13px;margin-top:4px}
.k-marke{background:var(--f1);color:#fff;border-radius:999px;font-weight:700;font-size:14px;padding:3px 10px}
.k-pfeil{font-size:26px;color:var(--leise)}
.fuss{display:block;margin:22px auto 0;background:none;border:0;color:var(--leise);font-size:13.5px;padding:8px}

/* ---------- Produkte ---------- */
.werkzeug{display:flex;gap:8px;padding:12px 12px 0;align-items:center}
.werkzeug input[type=search]{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--linie);
  background:var(--karte);padding:0 12px;font-size:16px}
.werkzeug .knopf{width:auto;min-height:44px;padding:0 14px}
.hinweiszeile{padding:8px 16px 0;font-size:12.5px;color:var(--leise)}
.info-box{margin:10px 12px 0;padding:10px 12px;border-radius:12px;background:var(--karte);border:1px dashed var(--akzent);font-size:14px}
.liste-kopf{display:flex;justify-content:flex-end;padding:2px 10px 0}
.kat{background:var(--karte);border-radius:var(--r);margin:8px 12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kat-kopf{display:flex;align-items:center;gap:10px;width:100%;padding:14px;border:0;background:none;text-align:left;font-weight:650;font-size:16.5px}
.kat-kopf .pfeil{display:inline-block;transition:transform .18s;color:var(--leise);font-size:20px;width:12px}
.kat.offen .kat-kopf .pfeil{transform:rotate(90deg)}
.kat-name{flex:1}
.zahl{font-size:13px;color:var(--leise);font-weight:500}
.kat:not(.offen) .kat-inhalt{display:none}
.kat-alle{display:flex;justify-content:space-between;padding:0 10px 6px;border-top:1px solid var(--linie)}
.g-name{padding:12px 14px 0;font-weight:600;border-top:1px solid var(--linie)}
.art{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 14px;border-top:1px solid var(--linie)}
.art.variante{border-top:0;padding-top:6px;padding-left:26px}
.gruppe .art.variante + .art.variante{border-top:1px dashed var(--linie)}
.art.hat-menge{background:rgba(127,127,127,.10);background:color-mix(in srgb,var(--akzent) 11%,var(--karte))}
.art.aus .art-text{opacity:.45}
.art-text{flex:1;min-width:0}
.a-name{font-weight:600}
.info{font-size:13.5px;color:var(--leise)}
.preis{font-size:13.5px}
.warn{font-size:12.5px;color:var(--warn);background:var(--warn-bg);border-radius:6px;padding:2px 6px;margin-top:3px;display:inline-block}
.aus-label{font-size:12px;color:var(--leise);font-style:italic}
.stepper{display:flex;align-items:center;flex:none;border:1px solid var(--linie);border-radius:12px;overflow:hidden;background:var(--karte)}
.stepper button{width:40px;height:42px;border:0;background:transparent;font-size:23px;line-height:1;color:var(--link)}
.stepper input{width:42px;height:42px;border:0;border-left:1px solid var(--linie);border-right:1px solid var(--linie);
  text-align:center;font-size:17px;font-weight:700;background:transparent;-moz-appearance:textfield;appearance:textfield;padding:0}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.schalter{position:relative;flex:none;width:52px;height:32px}
.schalter input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.schalter span{position:absolute;inset:0;border-radius:999px;background:#c5c9d0;transition:background .15s}
.schalter span::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.schalter input:checked + span{background:var(--ok)}
.schalter input:checked + span::after{transform:translateX(20px)}

/* ---------- Bestellzettel ---------- */
.klapp-kopf{display:flex;align-items:center;gap:10px;width:100%;padding:14px;border:0;background:none;text-align:left;font-weight:650}
.klapp-kopf .pfeil{display:inline-block;transition:transform .18s;color:var(--leise);font-size:20px;width:12px}
.klapp.offen > .klapp-kopf .pfeil{transform:rotate(90deg)}
.klapp-kopf .sub{display:block;font-weight:400;font-size:13px;color:var(--leise)}
.klapp:not(.offen) > .klapp-inhalt{display:none}
.klapp-inhalt{padding:0 14px 14px}
.feld{display:block;margin-top:10px}
.feld > span{display:block;font-size:13px;color:var(--leise);margin-bottom:3px}
.feld input,.feld textarea,.feld select{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--linie);
  background:var(--bg);padding:9px 11px;font-size:16px}
.feld textarea{min-height:64px;resize:vertical}
.feld input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%;text-align:left}
.feld input[type=date]::-webkit-date-and-time-value{text-align:left}
.st{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:4px;vertical-align:1px;white-space:nowrap}
.st.offen{background:var(--warn-bg);color:var(--warn)}
.st.geliefert{background:rgba(43,138,62,.14);color:var(--ok)}
.st.storniert{background:rgba(201,42,42,.12);color:var(--rot)}
details.hist.storniert summary > b{text-decoration:line-through;opacity:.7}
.hist-akt{flex-wrap:wrap;gap:4px 10px}
.kunde.storniert .a-name,.kunde.storniert .info{text-decoration:line-through;opacity:.5}
.kunde.storniert .k-haken span{color:var(--rot);border-color:var(--rot)}
.storno-feld{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px}
.storno-feld input{width:22px;height:22px;flex:none}
/* Mindestbestand */
.bst-zeile{font-size:13.5px;margin-top:3px;line-height:1.45}
.bst-zeile:empty{display:none}
.ok-text{color:var(--ok)}
.rot-text{color:var(--rot)}
.art.unter-min{box-shadow:inset 4px 0 0 var(--rot)}
.bst-felder{display:flex;gap:6px;flex:none}
.bst-felder label{display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--leise);font-weight:600}
.bst-felder input{width:58px;height:42px;border-radius:10px;border:1px solid var(--linie);background:var(--karte);text-align:center;font-size:17px;font-weight:700;color:var(--text);padding:0;margin-top:2px}
.bst-felder label:last-child input{border-color:var(--link)}
.bestand-box.unter{border-color:var(--rot);border-style:solid}
.nur-min{display:flex;align-items:center;gap:8px;margin-top:8px;font-weight:600}
.nur-min input{width:20px;height:20px}
.marke.rot{background:var(--rot);color:#fff}
.pos{display:flex;align-items:center;gap:10px;padding:11px 12px 11px 14px;border-top:1px solid var(--linie)}
.pos:first-child{border-top:0}
.summe{display:flex;justify-content:space-between;align-items:baseline;padding:13px 14px;border-top:2px solid var(--linie);font-weight:700;font-size:17px}
.summe small{display:block;font-weight:400;font-size:12px;color:var(--leise)}
.aktionen{display:grid;gap:10px;padding:0 12px}
.hist{padding:10px 0;border-top:1px solid var(--linie)}
.hist:first-child{border-top:0}
.hist ul{margin:4px 0;padding-left:20px;font-size:14px}
.hist-akt{display:flex;justify-content:space-between}

.preisfeld{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px;margin-top:4px}
.preisfeld input{width:92px;height:38px;border-radius:9px;border:1px solid var(--linie);background:var(--bg);
  padding:0 8px;font-size:16px;text-align:right}
.leiste{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:15;max-width:736px;margin:0 auto;
  display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--akzent);color:#fff;text-decoration:none;
  border-radius:14px;padding:10px 16px;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.leiste small{display:block;font-size:12.5px;opacity:.92}
.leiste.ok small{font-weight:700}
.leiste-ziel{font-weight:700;white-space:nowrap}
#leisteBox:not(:empty){height:84px}
.mindest{padding:0 14px 14px;font-size:14.5px}
.mindest .balken{height:8px;border-radius:99px;background:var(--linie);overflow:hidden;margin-bottom:6px}
.mindest .balken span{display:block;height:100%;background:#e8590c;border-radius:99px}
.mindest.erreicht{color:var(--ok);font-weight:700}
.mindest.erreicht .balken span{background:var(--ok)}
.klein-aktionen{display:flex;justify-content:center;gap:18px}
.wege{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.weg{position:relative}
.weg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.weg span{display:block;text-align:center;border:1px solid var(--linie);border-radius:12px;padding:8px 2px;font-size:14px;line-height:1.5;background:var(--bg)}
.weg input:checked + span{border-color:var(--akzent);background:var(--akzent);color:#fff;font-weight:700}
details.hist{padding:2px 0;border-top:1px solid var(--linie)}
details.hist:first-child{border-top:0}
details.hist summary{padding:10px 0 10px 22px;cursor:pointer;list-style:none;position:relative}
details.hist summary::-webkit-details-marker{display:none}
details.hist summary::before{content:"›";position:absolute;left:4px;top:8px;font-size:20px;color:var(--leise);transition:transform .18s}
details.hist[open] summary::before{transform:rotate(90deg)}
.hist-sub{display:block;font-size:13px;color:var(--leise);font-weight:400}
.notiz{font-size:14px;background:var(--bg);border-radius:8px;padding:6px 8px;margin:2px 0 6px}

.sync-zeile{display:block;margin:18px auto 0;background:var(--karte);border:1px solid var(--linie);border-radius:999px;
  padding:8px 16px;font-size:14px;color:var(--text);max-width:92%}
.sync-zeile.fehler{color:var(--warn);border-color:var(--warn)}
.hinweis-karte{border:1px solid var(--warn)}
.sy-info{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.7}
.sy-meldung{display:block;margin-top:12px;font-size:14px}
.sy-verlauf{margin-top:12px;font-size:13.5px}
.sy-verlauf summary{padding:6px 0;cursor:pointer;font-weight:600}
.sy-verlauf ul{margin:4px 0;padding-left:18px}

.update-leiste{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff4e6;color:#5c3200;
  padding:8px 12px;font-size:14.5px;border-top:1px solid rgba(0,0,0,.08)}
.update-leiste.innen{border:1px solid #f0a040;border-radius:12px;margin:8px 0}
.update-knopf{flex:none;border:0;border-radius:999px;background:#e8590c;color:#fff;font-weight:700;padding:8px 14px;font-size:14.5px}
.ver-stand{font-size:14.5px;margin:2px 0 6px}
.marke.grau{background:var(--linie);color:var(--text);font-weight:600}
.marke.okmarke{background:var(--ok)}
.marke.warnmarke{background:#e8590c}

/* ---------- Rasting (Saison) ---------- */
.art.saison{flex-wrap:wrap}
.art.saison .art-text{flex:1 1 60%}
.tage{display:flex;flex-wrap:wrap;gap:8px 12px;width:100%;justify-content:flex-end;margin-top:4px}
.tag{display:flex;flex-direction:column;align-items:center;gap:2px}
.tag-kopf{font-size:12.5px;font-weight:700;color:var(--leise)}
.tag.hat .tag-kopf{color:var(--akzent)}
.tag-kg{font-size:12.5px;color:var(--leise);min-height:16px}
.tag.hat .tag-kg{color:var(--text);font-weight:600}
.bearb-knoepfe{display:flex;align-items:center;gap:4px}
.eigene-box{margin:12px;padding:12px;border:1px dashed var(--linie);border-radius:var(--r);background:var(--karte)}
.saison-status{margin:12px;padding:12px 14px;border-radius:var(--r);background:var(--karte);border-left:5px solid var(--akzent);font-size:15.5px}
.saison-status span{display:block;font-size:13.5px;color:var(--leise);margin-top:2px}
.saison-status.ok{border-left-color:var(--ok)}
.saison-status.warn{border-left-color:var(--rot)}
.klapp-inhalt.ohne-rand{padding:0}
.artnr{display:inline-block;font-size:12.5px;font-weight:700;background:var(--bg);border-radius:6px;padding:0 5px;margin-right:2px}
.delta{font-size:12.5px;font-weight:700;border-radius:6px;padding:1px 6px}
.delta.plus{background:#ffe3e3;color:#a61e1e}
.delta.minus{background:#fff0db;color:#8a4b00}
.aenderungen{border:1px solid #f0a040}
.delta-zeile{padding:6px 0;border-top:1px solid var(--linie);font-size:14.5px}
.delta-zeile:first-child{border-top:0}
.delta-liste{padding-left:20px}
.anruf-reihe{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.anruf-chip{background:#2f9e44;color:#fff;text-decoration:none;border-radius:999px;padding:8px 14px;font-weight:700;font-size:14.5px}
.feld-reihe{display:flex;gap:10px}
.feld-reihe .feld{flex:1}
.haken{display:flex;align-items:center;gap:8px;margin-top:14px;font-weight:600}
.haken input{width:22px;height:22px}
.saison-info p{margin:0 0 8px;font-size:14.5px}

/* ---------- Rasting: Kundenbestellungen ---------- */
.tag-kd{font-size:12px;color:var(--leise);font-weight:600}
.tag-kd.fehlt{color:var(--rot);font-weight:700}
.kd-zeile{font-size:13.5px;margin-top:4px;line-height:1.45}
.kd-zeile.fehlt{color:var(--rot);font-weight:600}
.kd-zeile.ok{color:var(--ok)}
.nw{white-space:nowrap}
.kd-knopf{border:0;border-radius:999px;background:var(--rot);color:#fff;font-weight:700;padding:4px 10px;font-size:13px;margin-left:2px;white-space:nowrap}
.pos.kd-fehlt{box-shadow:inset 4px 0 0 var(--rot)}
.kd-karte{border-left:5px solid var(--ok)}
.kd-karte.fehlt{border-left-color:var(--rot)}
.kd-status{margin:4px 0 8px;font-size:15px}
.bd-tag{font-weight:700;font-size:12.5px;color:var(--leise);text-transform:uppercase;letter-spacing:.03em;margin:12px 0 2px}
.bd-tag:first-child{margin-top:0}
.bd-zeile{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--linie);font-size:14.5px}
.bd-zeile small{display:block;color:var(--leise);font-size:12.5px;font-weight:400}
.bd-r{text-align:right;white-space:nowrap}
.bd-zeile.fehlt .bd-r small{color:var(--rot);font-weight:700}
.kunde{display:flex;align-items:flex-start;gap:12px;padding:11px 10px 11px 14px;border-top:1px solid var(--linie)}
.kunde:first-child{border-top:0}
.kunde .art-text{flex:1;min-width:0}
.kunde.abgeholt .a-name,.kunde.abgeholt .info{opacity:.55}
.k-haken{position:relative;flex:none;width:36px;height:36px;margin-top:1px}
.k-haken input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.k-haken span{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;border:2px solid #c5c9d0;color:transparent;font-weight:800;font-size:19px}
.k-haken input:checked + span{background:var(--ok);border-color:var(--ok);color:#fff}
.ok-label{font-size:12.5px;color:var(--ok);font-weight:700;margin-top:2px}
.kf-kopf{display:flex;justify-content:space-between;align-items:center;margin:14px 14px 0;font-size:17px}
.kf-zeile{display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;border-top:1px solid var(--linie)}
.kf-zeile.hat{background:rgba(43,138,62,.08)}
.kf-zeile .art-text{flex:1;min-width:0}
.kf-pos{flex:none;width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13.5px;font-weight:700;color:var(--leise)}
.kf-zeile.hat .kf-pos{background:var(--ok);color:#fff}
.kf-menge{display:flex;align-items:center;flex:none;border:1px solid var(--linie);border-radius:11px;overflow:hidden;background:var(--karte)}
.kf-menge input{width:62px;height:42px;border:0;text-align:center;font-size:17px;font-weight:700;background:transparent;padding:0;color:var(--text)}
.kf-einheit{min-width:44px;height:42px;border:0;border-left:1px solid var(--linie);background:var(--bg);font-weight:700;font-size:15px;color:var(--text);padding:0 6px}
.kf-einheit.fest{display:grid;place-items:center;font-weight:600;color:var(--leise)}
.kf-suche{width:100%;min-height:44px;border-radius:10px;border:1px solid var(--linie);background:var(--bg);padding:9px 11px;font-size:16px;color:var(--text)}
.kf-treffer{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--linie);background:none;padding:11px 2px;font-size:15px;color:var(--text)}
.kf-treffer:first-child{margin-top:6px}
.kf-treffer.schon{color:var(--leise)}

/* ---------- Kontakt ---------- */
.kz{display:flex;align-items:center;border-top:1px solid var(--linie)}
.kz:first-of-type{border-top:0}
.kz-link{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px;color:inherit;text-decoration:none}
.kz-icon{width:40px;height:40px;flex:none;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--bg)}
.kz-icon.gruen{background:#2f9e44;color:#fff}
.kz-text{flex:1;min-width:0;display:flex;flex-direction:column}
.kz-label{font-size:13px;color:var(--leise)}
.kz-wert{font-weight:600;overflow-wrap:anywhere}
.kz-name{font-size:14px;font-weight:600;color:var(--link);margin-top:1px}
.kz-aktion{flex:none;font-size:14px;font-weight:600;color:var(--link);background:none;border:0;padding:6px}
.kz-aktion.gruen{color:#fff;background:#2f9e44;border-radius:999px;padding:7px 14px}
.mini{border:0;background:none;padding:10px 12px;font-size:18px}
.kz .mini{padding:10px 10px 10px 2px}
.kundennr{font-size:28px;font-weight:800;letter-spacing:.02em}

/* ---------- Overlay (Hilfe / Info) ---------- */
#overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.blatt{position:relative;background:var(--karte);width:100%;max-width:640px;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 22px)}
@media (min-width:700px){ #overlay{align-items:center} .blatt{border-radius:20px} }
.blatt h2{margin:0 40px 10px 0;font-size:21px}
.blatt .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);font-size:16px}
.blatt details{border-top:1px solid var(--linie);padding:4px 0}
.blatt summary{padding:10px 0;font-weight:650;cursor:pointer}
.blatt details p{margin:0 0 10px;font-size:15px}
.blatt .knopf{margin-top:14px}
.credit{margin-top:18px;padding-top:12px;border-top:1px solid var(--linie);font-size:14px;color:var(--leise);text-align:center}
#verNeu{padding-left:20px}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);z-index:60;
  background:#1f2937;color:#fff;border-radius:12px;padding:10px 16px;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.25);margin-bottom:84px;
  max-width:90vw;transition:opacity .25s;pointer-events:none}

/* ---------- Druck ---------- */
#druck{display:none}
@media print{
  @page{size:A4;margin:14mm 14mm 16mm}
  html,body{background:#fff !important;color:#000 !important;padding:0}
  #kopf,#app,#overlay,.toast{display:none !important}
  #druck{display:block;font:10.5pt/1.35 Arial,Helvetica,sans-serif;color:#000;padding:0 3px 0 1px}
  #druck *{color:#000}
  .d-kopf{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6px}
  .d-titel{font-size:20pt;font-weight:700}
  .d-weg{margin:6px 0 10px;font-weight:700}
  .d-daten{display:flex;gap:16px;margin-bottom:12px}
  .d-daten > div{flex:1;min-width:0;border:1px solid #999;padding:6px 8px}
  .d-daten .t{font-size:8.5pt;text-transform:uppercase;letter-spacing:.04em;color:#444;margin-bottom:3px}
  .d-daten table td{padding:1px 8px 1px 0;vertical-align:top}
  .d-daten table td:first-child{color:#444;white-space:nowrap}
  .d-pos{width:100%;border-collapse:collapse}
  .d-pos th,.d-pos td{border:1px solid #888;padding:4px 6px;vertical-align:top}
  .d-pos th{background:#e9e9e9;font-size:9pt;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .d-pos tr{break-inside:avoid}
  .d-pos .r{text-align:right;white-space:nowrap}
  .d-pos .m{font-weight:700;font-size:12pt;text-align:center}
  .d-klein{font-size:8.5pt;color:#333}
  .d-summe{text-align:right;margin-top:6px;font-weight:700;font-size:12pt}
  .d-summe span{display:block;font-weight:400;font-size:8.5pt}
  .d-bem{margin-top:10px;border:1px solid #999;padding:6px 8px}
  .d-unterschrift{display:flex;gap:40px;margin-top:46px}
  .d-unterschrift div{flex:1;border-top:1px solid #000;padding-top:3px;font-size:9pt}
  .d-fuss{margin-top:18px;font-size:8pt;color:#555}
  .d-tag{font-size:12pt;margin:14px 0 4px;break-after:avoid}
}
</style>
</head>

function b64enc(str) {

async function gh(method, datei, body) {

  try {
    return await fetch(url, { method, cache: 'no-store', signal: ctl.signal,
      headers: { 'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + SY.token, ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined });

}

  if (r.status === 403) return new Error('Kein Zugriff – beim Schlüssel „Contents: Read and write“ für dieses Repo prüfen');
  if (r.status === 429) return new Error('GitHub-Limit erreicht – gleich nochmal versuchen');
  if (r.status === 404) return new Error('Repo nicht gefunden – Name prüfen, und ob der Schlüssel Zugriff auf dieses Repo hat');
  return new Error('GitHub antwortet mit Fehler ' + r.status);

async function syncJetzt(vonHand) {
  if (!syAktiv()) return false;
  if (syLaeuft) { syNochmal = true; return false; }
  syLaeuft = true; renderSyncAnzeige();
  let zeichnen = false, ok = false;
  try {
    /* 1. Stammdaten holen */
    const st = await ghLesen(STAMM_DATEI);
    if (st.data) {
      if (st.data.app !== 'bestellungen-stammdaten') throw new Error('stammdaten.json passt nicht zu dieser App');
      if (canon(st.data) !== canon(STAMM)) {
        STAMM = st.data; zeichnen = true;
        try { localStorage.setItem(STAMM_KEY, JSON.stringify(STAMM)); } catch (e) { /* egal */ }
      }
    } else if (!STAMM) syLog('Hinweis: stammdaten.json fehlt im Repo');
    /* 2. Eigene Daten abgleichen */
    for (let versuch = 1; ; versuch++) {
      const r = await ghLesen(DATEN_DATEI);
      if (r.data && r.data.app !== 'bestellungen') throw new Error('bestellungen-daten.json gehört nicht zu dieser App – nichts überschrieben');
      if (r.data) neueVersionMelden(r.data.appVersion);
      const lokal = syncDaten(), m = mergeSync(lokal, r.data || lokal);
      if (inhalt(m) !== inhalt(lokal)) { applySync(m); zeichnen = true; }
      if (!r.data || inhalt(m) !== inhalt(r.data)) {
        const geschrieben = await ghSchreiben(DATEN_DATEI, Object.assign({}, m, { geraet: geraetName(), appVersion: APP_VERSION, gespeichert: new Date().toISOString() }), r.sha);
        if (!geschrieben) { if (versuch < 3) continue; throw new Error('Gleichzeitige Änderung auf GitHub – bitte gleich nochmal'); }
      }

    SY.fehler = e.message || String(e); syLog('✗ ' + SY.fehler);

    if (zeichnen) { if (eingabeAktiv()) UI.spaeterZeichnen = true; else neuZeichnen(); }

  if (!f || !el) return;
  const q = UI.suche.trim().toLowerCase(), aus = ausgeblendet(f), bearb = UI.bearbeiten;
  AKT_BD = bedarf(f);
  let html = '', gezeigt = 0;
  for (const k of kategorien(f)) {
    const alleInKat = alleArtikel(f).filter(a => a.k === k);
    let arts = alleInKat;
    if (q) arts = arts.filter(a => (a.n + ' ' + a.nr + ' ' + (a.artNr || '') + ' ' + (a.d || '') + ' ' + a.k).toLowerCase().includes(q));
    else if (!bearb) arts = arts.filter(a => !aus.has(a.nr));
    if (UI.zaehlen && UI.nurMin && !f.saison) arts = arts.filter(a => minVon(f, a.nr) !== undefined);
    if (!arts.length) continue;
    gezeigt += arts.length;
    const offen = q || S.offen[f.id + '|' + k] || (UI.zaehlen && UI.nurMin);
    const bestellt = alleInKat.filter(a => hatMenge(f, a)).length;
    const unter = f.saison ? 0 : alleInKat.filter(a => { const b = bestandStatus(f, a); return b && b.unter; }).length;
    html += `
      <section class="kat ${offen ? 'offen' : ''}">
        <button class="kat-kopf" data-akt="kat" data-kat="${esc(k)}">
          <span class="pfeil">›</span><span class="kat-name">${esc(k).replace(/ -(?=\S)/g, ' ‑')}</span>
          <span class="zahl">${arts.length}</span>
          ${f.saison ? '' : `<span class="marke rot" data-katunter="${esc(k)}" title="unter Mindestbestand" ${unter ? '' : 'hidden'}>${unter}</span>`}
          <span class="marke" data-katzahl="${esc(k)}" ${bestellt ? '' : 'hidden'}>${bestellt}</span>
        </button>
        <div class="kat-inhalt">
          ${bearb && !q ? `<div class="kat-alle"><button class="link" data-akt="katAn" data-kat="${esc(k)}">alle einblenden</button>
            <button class="link" data-akt="katAus" data-kat="${esc(k)}">alle ausblenden</button></div>` : ''}
          ${gruppenHtml(f, arts, aus, bearb)}
        </div>
      </section>`;
  }
  if (!gezeigt) html = q
    ? `<p class="leer">Nichts gefunden für „${esc(UI.suche)}“.</p>`
    : UI.zaehlen && UI.nurMin ? `<p class="leer">Noch kein Produkt mit Mindestbestand.<br>Haken „Nur Produkte mit Mindestbestand“ entfernen und bei den Produkten <b>Min.</b> eintragen.</p>`
    : `<p class="leer">Alle Produkte sind ausgeblendet.<br>Über <b>Bearbeiten</b> kannst du sie wieder einblenden.</p>`;
  if (!q && !bearb && aus.size && gezeigt)
    html += `<p class="leer klein">${aus.size} Produkt${aus.size > 1 ? 'e' : ''} ausgeblendet · <button class="link" data-akt="bearbeiten">Bearbeiten</button></p>`;
  el.innerHTML = html;
}
function gruppenHtml(f, arts, aus, bearb) {
  const gruppen = [];
  for (const a of arts) {
    const g = gruppen[gruppen.length - 1];
    if (g && g.n === a.n) g.arts.push(a); else gruppen.push({ n: a.n, arts: [a] });
  }
  return gruppen.map(g => g.arts.length === 1
    ? zeileHtml(f, g.arts[0], aus, bearb, true)
    : `<div class="gruppe"><div class="g-name">${esc(g.n)}</div>${g.arts.map(a => zeileHtml(f, a, aus, bearb, false)).join('')}</div>`
  ).join('');
}
function zeileHtml(f, a, aus, bearb, mitName) {
  if (f.saison) return zeileSaisonHtml(f, a, aus, bearb);
  const m = menge(f, a.nr), istAus = aus.has(a.nr);
  const info = `<div class="info">${esc(gebindeText(f, a))}${a.d ? ' · ' + esc(a.d) : ''} · Art. ${esc(a.nr)}</div>`;
  const p = preisVpe(f, a), geaendert = preisGeaendert(f, a), je = esc(einheitEinzahl(f, a)), lp = listenPreis(f, a);
  const preis = bearb
    ? `<label class="preisfeld">Preis je ${je}: <input data-preis data-nr="${esc(a.nr)}" type="text" inputmode="decimal"
         value="${p !== null ? zahlDe(p) : ''}" placeholder="kein Preis"> €${geaendert && typeof lp.pvpe === 'number'
         ? ` <span class="leise">(Liste ${eur(lp.pvpe)})</span>` : ''}</label>`
    : p !== null ? `<div class="preis">${!geaendert && lp.ppe ? `${eur(lp.ppe)} / ${esc(a.pe)} · ` : ''}<b>${eur(p)}</b> je ${je}${geaendert ? ' <span class="leise">(eigener Preis)</span>' : ''}</div>` : '';
  const hinweis = hinweisVon(f, a) && !geaendert ? `<div class="warn">⚠ ${esc(hinweisVon(f, a))}</div>` : '';
  const rechts = bearb
    ? `<label class="schalter" aria-label="sichtbar"><input type="checkbox" data-sichtbar data-nr="${esc(a.nr)}" ${istAus ? '' : 'checked'}><span></span></label>`
    : UI.zaehlen
    ? `<div class="bst-felder">
        <label><span>Min.</span><input data-min data-nr="${esc(a.nr)}" type="text" inputmode="decimal" value="${minVon(f, a.nr) !== undefined ? String(minVon(f, a.nr)).replace('.', ',') : ''}" placeholder="–" aria-label="Mindestbestand"></label>
        <label><span>Bestand</span><input data-ist data-nr="${esc(a.nr)}" type="text" inputmode="decimal" value="${istVon(f, a.nr) !== undefined ? String(istVon(f, a.nr)).replace('.', ',') : ''}" placeholder="–" aria-label="Bestand"></label>
      </div>`
    : stepperHtml(a.nr, m);
  const bst = bestandZeileHtml(f, a), b = bestandStatus(f, a);
  return `
    <div class="art ${m ? 'hat-menge' : ''} ${istAus ? 'aus' : ''} ${mitName ? '' : 'variante'} ${b && b.unter ? 'unter-min' : ''}" data-zeile="${esc(a.nr)}">
      <div class="art-text">${mitName ? `<div class="a-name">${esc(a.n)}</div>` : ''}${info}${UI.zaehlen ? '' : preis}${hinweis}
        <div class="bst-zeile" data-bst="${esc(a.nr)}">${bst}</div>
        ${istAus && !bearb ? '<div class="aus-label">ausgeblendet</div>' : ''}</div>
      ${rechts}
    </div>`;
}
/* Rasting: je Liefertag ein Zähler für die Anzahl Gebinde, darunter die Menge in kg/St./PK */

/* Rasting: eigene Artikel anlegen + Vorschläge (Karpfen über den Bestpreis) */

function stepperHtml(nr, m) {

function nachMengenAenderung(f, nr) {
  if (UI.reiter === 'bestellung') { neuZeichnen(); return; }
  const m = menge(f, nr), art = artikelNr(f, nr), id = String(nr).split('@')[0];
  $$('[data-menge]').forEach(i => { if (i.dataset.nr === nr && i !== document.activeElement) i.value = m || ''; });
  $$('[data-zeile]').forEach(z => { if (z.dataset.zeile === id) z.classList.toggle('hat-menge', art ? hatMenge(f, art) : m > 0); });
  $$('[data-kg]').forEach(k => { if (k.dataset.kg === nr && art) { k.innerHTML = m ? '= ' + esc(inhaltText(art, m)) : '&nbsp;'; k.parentElement.classList.toggle('hat', m > 0); } });
  $$('[data-kd]').forEach(k => { const b = AKT_BD[nr]; if (k.dataset.kd === nr && b) k.classList.toggle('fehlt', deckung(b, m).fehlt); });
  $$('[data-katzahl]').forEach(b => {
    const n = alleArtikel(f).filter(a => a.k === b.dataset.katzahl && hatMenge(f, a)).length;
    b.textContent = n; b.hidden = !n;
  });
  const t = $('[data-reiterzahl]');
  if (t) { const n = positionen(f).length; t.textContent = n; t.hidden = !n; }
  const lb = $('#leisteBox');
  if (lb && !UI.bearbeiten) lb.innerHTML = leisteHtml(f);
  if (!f.saison && (minVon(f, id) !== undefined || istVon(f, id) !== undefined)) bestandAktualisieren(f, id);
}

/* Bestellzettel */
const KOPF_FELDER = [
  ['kundennr', 'Kunden-Nr.', 'text'], ['name', 'Firma / Name', 'text'], ['abteilung', 'Abteilung', 'text'],
  ['lieferanschrift', 'Lieferanschrift', 'area'], ['telefon', 'Tel. bei Rückfragen', 'tel'],
  ['besteller', 'Besteller/in', 'text'], ['mindestwert', 'Mindestbestellwert (netto, €)', 'zahl'],
  ['liefertermin', 'Gewünschter Liefertermin', 'date'], ['bemerkung', 'Bemerkung', 'area'],
];
function kopfSubText(k) {
  return `Kunden-Nr. ${esc(k.kundennr || '–')} · ${k.besteller ? 'Besteller/in: ' + esc(k.besteller) : 'Besteller/in fehlt noch'}`;
}
/* Summe + Mindestbestellwert im Bestellzettel */
function summenHtml(f) {
  const min = mindestwert(f), sum = summe(f);
  if (!hatPreise(f)) return min
    ? `<div class="mindest">Für den Mindestbestellwert ${eur(min)} fehlen Preise – unter <b>Produkte › Bearbeiten</b> eintragen.</div>` : '';
  let html = `<div class="summe"><span>Summe netto<small>zzgl. MwSt.</small></span><span>${eur(sum)}</span></div>`;
  if (min) {
    const fehlt = min - sum, pct = Math.max(0, Math.min(100, Math.round(sum / min * 100)));
    html += `<div class="mindest ${fehlt <= 0 ? 'erreicht' : ''}">
      <div class="balken"><span style="width:${pct}%"></span></div>
      ${fehlt <= 0 ? `✓ Mindestbestellwert ${eur(min)} erreicht` : `Noch <b>${eur(fehlt)}</b> bis zum Mindestbestellwert ${eur(min)}`}</div>`;
  }
  return html;
}

      <div class="klapp-inhalt">${histHtml}</div>

/* ---------- Rasting: Bestellzettel je Liefertag, „Per MDE gesendet“, Änderungen ---------- */
function saisonDeltas(f) {
  const gs = S.gesendet[f.id];
  if (!gs || !gs.mengen) return [];
  const mm = S.mengen[f.id] || {}, alle = alleArtikel(f), out = [];
  for (const key of new Set([...Object.keys(gs.mengen), ...Object.keys(mm)])) {
    const d = (mm[key] || 0) - (gs.mengen[key] || 0), a = artikelNr(f, key);
    if (d && a) out.push({ key, a, tag: tagVon(key), d, vorher: gs.mengen[key] || 0, jetzt: mm[key] || 0 });
  }
  return out.sort((x, y) => f.tage.indexOf(x.tag) - f.tage.indexOf(y.tag) || alle.indexOf(x.a) - alle.indexOf(y.a));
}
function posSaisonHtml(f, p, gs, mitTag, b) {
  const d = gs ? p.m - (gs.mengen[p.key] || 0) : 0, dk = b ? deckung(b, p.m) : null;
  return `
    <div class="pos ${dk && dk.fehlt ? 'kd-fehlt' : ''}">
      <div class="art-text">
        <div class="a-name">${p.a.artNr ? `<span class="artnr">${esc(p.a.artNr)}</span> ` : ''}${esc(p.a.n)}</div>
        <div class="info">${esc(gebindeText(f, p.a))}${mitTag ? ' · ' + esc(f.tagKurz[p.tag]) : ''}</div>
        <div class="preis"><b>${p.m ? `${p.m} Geb. = ${esc(inhaltText(p.a, p.m))}` : 'noch nichts bestellt'}</b>${d ? ` <span class="delta ${d > 0 ? 'plus' : 'minus'}">${d > 0 ? '+' : ''}${d} seit dem Senden</span>` : ''}</div>
        ${b ? `<div class="kd-zeile ${dk.fehlt ? 'fehlt' : 'ok'}">👥 Kunden ${esc(peMenge(p.a, b.pe))} <span class="leise">(${b.n})</span> · <span class="nw">${esc(dk.text)}</span>${dk.fehlt
          ? ` <button class="kd-knopf" data-akt="vorschlag" data-key="${esc(p.key)}" data-m="${b.vorschlag}">auf ${b.vorschlag} Geb.</button>` : ''}</div>` : ''}
      </div>
      ${stepperHtml(p.key, p.m)}
    </div>`;
}
/* Zeilen eines Liefertags: alles mit Menge + alles, was Kunden bestellt haben */
function saisonZeilen(f, pos, bd, filter) {
  const map = new Map();
  for (const p of pos) if (filter(p.a, p.tag)) map.set(p.key, p);
  for (const b of Object.values(bd)) if (filter(b.a, b.tag) && !map.has(b.key)) map.set(b.key, { a: b.a, m: 0, key: b.key, tag: b.tag });
  const alle = alleArtikel(f);
  return [...map.values()].sort((x, y) => f.tage.indexOf(x.tag) - f.tage.indexOf(y.tag) || alle.indexOf(x.a) - alle.indexOf(y.a));
}
function ansprechpartnerHtml(f, kompakt) {
  const liste = festeKontakte(f).filter(x => x.typ === 'tel' || x.typ === 'mobil');
  if (!liste.length) return `<p class="leise klein">Ansprechpartner kommen mit dem Abgleich (stammdaten.json im privaten Repo).</p>`;
  return kompakt
    ? `<div class="anruf-reihe">${liste.map(x => `<a class="anruf-chip" href="${telHref(x.wert)}">📞 ${esc((x.name || x.label).split(' ')[0])}</a>`).join('')}</div>`
    : liste.map(kontaktZeile).join('');
}
function bestellungSaisonHtml(f) {
  const pos = positionen(f), gs = S.gesendet[f.id], deltas = saisonDeltas(f), hist = S.historie[f.id] || [];
  const bd = bedarf(f), fehlt = fehlende(f, bd), nKunden = aktiveKunden(f).length;
  const vorbei = new Date(f.frist).getTime() <= Date.now();
  const status = gs
    ? `<div class="saison-status ok">✓ <b>Per MDE gesendet</b> am ${esc(gs.datum)}${gs.uhr ? ', ' + esc(gs.uhr) + ' Uhr' : ''}
        <span>${esc(f.info.aenderungen)}</span></div>`
    : `<div class="saison-status ${vorbei ? 'warn' : ''}">📟 Abgabe per MDE: <b>${esc(f.fristText)}</b>
        <span>${esc(fristRest(f))} · nur einmal senden, nur vom roten Sendeblatt</span></div>`;
  const fehltText = liste => { const n = liste.filter(p => bd[p.key] && deckung(bd[p.key], p.m).fehlt).length; return n ? ` · 🔴 ${n} reich${n > 1 ? 'en' : 't'} nicht` : ''; };
  const tage = f.tage.map(t => {
    const liste = saisonZeilen(f, pos, bd, (a, tag) => tag === t && a.mde !== false);
    if (!liste.length) return '';

/* Status einer früheren Bestellung: '' = Lieferung offen, 'geliefert', 'storniert' (mit Datum statusIso) */

function histFinden(f, id) { return (S.historie[f.id] || []).find(x => String(x.id) === String(id)); }

function histSpeichern(f, id) {
  const h = histFinden(f, id);

  const st = ($('input[name=hbStatus]:checked') || {}).value || '';
  const weg = ($('input[name=hbWeg]:checked') || {}).value || h.weg;
  const iso = $('#hb-datum').value || h.iso;
  if (iso !== h.iso) { h.iso = iso; h.datum = isoZuDe(iso); h.zeit = ''; }
  h.status = st;
  h.statusIso = st ? ($('#hb-statusdatum').value || heuteIso()) : '';
  h.weg = weg;
  h.partner = weg === 'telefon' ? $('#hb-partner').value.trim() : '';
  h.notiz = $('#hb-notiz').value.trim();
  h.t = Date.now();
  S.historie[f.id].sort(histSort);
  speichern(); schliesseOverlay(); UI.histOffen = true; neuZeichnen(); toast('Gespeichert ✓');
}
function histEintrag(f, weg, partner, notiz, posten) {
  const iso = heuteIso();
  const e = { id: Date.now(), iso, datum: isoZuDe(iso), zeit: new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }),
              weg, partner, notiz, besteller: kopfDaten(f).besteller, posten, summe: 0 };
  S.historie[f.id] = [e, ...(S.historie[f.id] || [])].sort(histSort).slice(0, 60);
}
function mdeGesendet(f) {
  const pos = positionen(f);

  pos.forEach(p => { mengen[p.key] = p.m; });
  S.gesendet[f.id] = { zeit: jetzt.getTime(), datum: heuteDe(), uhr: jetzt.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }), mengen };
  histEintrag(f, 'mde', '', 'Weihnachtsbestellung per MDE gesendet', pos.map(p => ({ nr: p.key, m: p.m })));

}

function aenderungOk(f) {
  const d = saisonDeltas(f);

  histEintrag(f, 'telefon', $('#ae-partner').value.trim(), $('#ae-notiz').value.trim(), d.map(x => ({ nr: x.key, m: x.d })));

function eigenSpeichern(f, id) {
  const n = $('#ea-n').value.trim(), nr = $('#ea-nr').value.trim();
  if (!n) { toast('Bitte eine Bezeichnung eintragen.'); return; }
  if (nr && f.artikel.some(a => a.artNr === nr)) { toast('Art.-Nr. ' + nr + ' steht schon im Ordersatz.'); return; }
  const inh = parseZahl($('#ea-inh').value);
  const e = { id: id || 'e' + Date.now().toString(36), n, nr, inh: inh > 0 ? inh : 1, pe: $('#ea-pe').value, gruppe: $('#ea-gruppe').value, mde: $('#ea-mde').checked };
  const liste = (S.eigene[f.id] ||= []), i = liste.findIndex(x => x.id === e.id);
  if (i >= 0) liste[i] = e; else liste.push(e);
  const tage = f.gruppen[e.gruppe].tage, mm = S.mengen[f.id] || {};
  for (const k of Object.keys(mm)) if (k.startsWith(e.id + '@') && !tage.includes(tagVon(k))) delete mm[k];
  S.offen[f.id + '|Eigene Artikel'] = true;
  speichern(); schliesseOverlay(); neuZeichnen();
  toast('Gespeichert ✓');
}
function eigenLoeschen(f, id) {
  const liste = S.eigene[f.id] || [], e = liste.find(x => x.id === id);
  if (!e || !confirm(`„${e.n}“ löschen? Eingetragene Mengen dieses Artikels gehen mit.`)) return;
  S.eigene[f.id] = liste.filter(x => x.id !== id);
  const mm = S.mengen[f.id] || {};
  for (const k of Object.keys(mm)) if (k.startsWith(id + '@')) delete mm[k];
  speichern(); schliesseOverlay(); neuZeichnen();
}
function druckSaisonHtml(f) {

function kListeHtml(f) {

function bestellText(f) {
  const k = kopfDaten(f), pos = positionen(f);

  let t = 'Sehr geehrte Damen und Herren,\n\nbitte liefern Sie uns folgende Artikel:\n\n';
  for (const { a, m } of pos) t += `${m} ${einheit(f, a, m)} – Art.-Nr. ${a.nr} – ${a.n} (${gebindeText(f, a)})\n`;
  t += `\nKunden-Nr.: ${k.kundennr}\n${k.name}${k.abteilung ? ', Abteilung ' + k.abteilung : ''}\n`;
  t += `Lieferanschrift: ${k.lieferanschrift.replace(/\n/g, ', ')}\n`;

  if (k.bemerkung) t += `Bemerkung: ${k.bemerkung}\n`;

}

function ablegen(f) {

  S.historie[f.id] = [eintrag, ...(S.historie[f.id] || [])]

function histUebernehmen(f, id) {

  S.mengen[f.id] = mm;
  speichern(); neuZeichnen(); window.scrollTo(0, 0);

      if (!wert) { toast('Bitte Nummer, Adresse oder Text eintragen.'); return; }
      const namen = { tel: 'Telefon', mobil: 'Mobil', fax: 'Fax', mail: 'E-Mail', notiz: 'Notiz' };
      (S.kontaktExtra[f.id] ||= []).push(Object.assign({ typ, label: label || namen[typ], wert }, name ? { name } : {}));
      speichern(); UI.neuOffen = false; neuZeichnen(); toast('Kontakt gespeichert');
      break;
    }
    case 'kontaktBearb': {
      const x = el.dataset.k !== undefined ? festeKontakte(f).find(k => k.key === el.dataset.k) : eigeneKontakte(f)[Number(el.dataset.i)];
      if (x) zeigeOverlay(kontaktBearbHtml(f, x));
      break;
    }
    case 'kontaktSpeichern': {
      const name = $('#kb-name').value.trim(), label = $('#kb-label').value.trim(), wert = $('#kb-wert').value.trim();
      if (!wert) { toast('Die Nummer/Adresse darf nicht leer sein.'); return; }
      if (el.dataset.k !== undefined) {
        const x = festeKontakte(f).find(k => k.key === el.dataset.k);
        if (!x) break;
        const o = x.original, a = {};
        if (name) a.name = name;
        if (label && label !== o.label) a.label = label;
        if (wert !== o.wert) a.wert = wert;
        const m = (S.kontaktAend[f.id] ||= {});
        if (Object.keys(a).length) m[x.key] = a; else delete m[x.key];
      } else {
        const liste = S.kontaktExtra[f.id] || [], i = Number(el.dataset.i);
        if (!liste[i]) break;
        liste[i] = Object.assign({ typ: liste[i].typ, label: label || liste[i].label, wert }, name ? { name } : {});
      }
      speichern(); schliesseOverlay(); neuZeichnen(); toast('Gespeichert ✓');
      break;
    }
    case 'kontaktOriginal': {
      const m = S.kontaktAend[f.id] || {};
      if (m[el.dataset.k] && confirm('Name, Bezeichnung und Nummer wieder wie vorgegeben?')) {
        delete m[el.dataset.k]; speichern(); schliesseOverlay(); neuZeichnen(); toast('Original wiederhergestellt');
      }
      break;
    }
    case 'kontaktLoeschen': {
      const liste = S.kontaktExtra[f.id] || [], i = Number(el.dataset.i);
      if (liste[i] && confirm(`„${liste[i].label}“ löschen?`)) { liste.splice(i, 1); speichern(); schliesseOverlay(); neuZeichnen(); }
      break;
    }
    case 'mdeGesendet': mdeGesendet(f); break;
    case 'aenderungDurch': zeigeOverlay(aenderungHtml(f)); break;
    case 'aenderungOk': aenderungOk(f); break;
    case 'gesendetZurueck':
      if (confirm('„Per MDE gesendet“ zurücknehmen?\n\nDie gemerkten Mengen werden vergessen, die eingetragenen Mengen bleiben.')) {
        delete S.gesendet[f.id]; speichern(); neuZeichnen();
      }
      break;
    case 'eigenNeu': zeigeOverlay(eigenHtml(f, null)); break;
    case 'eigenBearb': zeigeOverlay(eigenHtml(f, el.dataset.id)); break;
    case 'eigenSpeichern': eigenSpeichern(f, el.dataset.id); break;
    case 'eigenLoeschen': eigenLoeschen(f, el.dataset.id); break;
    case 'eigenVorschlag': {
      const v = (f.vorschlaege || []).find(x => x.nr === el.dataset.nr);
      if (!v) break;
      const e = { id: 'e' + Date.now().toString(36), n: v.n, nr: v.nr, inh: 1, pe: 'kg', gruppe: 'F', mde: false };
      (S.eigene[f.id] ||= []).push(e);
      S.offen[f.id + '|Eigene Artikel'] = true;
      speichern(); neuZeichnen();
      zeigeOverlay(eigenHtml(f, e.id));
      toast('Angelegt – bitte Inhalt je Gebinde prüfen');
      break;
    }
    case 'vorschlag': setMenge(f, el.dataset.key, Number(el.dataset.m)); toast('Übernommen ✓'); break;
    case 'alleVorschlaege': {
      const liste = fehlende(f, bedarf(f));
      if (!liste.length) break;
      const mm = (S.mengen[f.id] ||= {});
      liste.forEach(b => { mm[b.key] = Math.max(mm[b.key] || 0, b.vorschlag); });
      speichern(); neuZeichnen();
      toast(`${liste.length} Vorschl${liste.length > 1 ? 'äge' : 'ag'} übernommen ✓`);
      break;
    }
    case 'kNeu': UI.kDraft = kundeEntwurf(f, null); UI.kSuche = ''; render(); window.scrollTo(0, 0); break;
    case 'kBearb': {
      const k = (S.kunden[f.id] || {})[el.dataset.id];
      if (k) { UI.kDraft = kundeEntwurf(f, k); UI.kSuche = ''; render(); window.scrollTo(0, 0); }
      break;
    }
    case 'kfAbbrechen': UI.kDraft = null; UI.kSuche = ''; render(); window.scrollTo(0, 0); break;
    case 'kfSpeichern': kfSpeichern(f, false); break;
    case 'kfSpeichernNeu': kfSpeichern(f, true); break;
    case 'kfLoeschen':
      if (UI.kDraft && kundeLoeschen(f, UI.kDraft.id)) { UI.kDraft = null; render(); window.scrollTo(0, 0); toast('Gelöscht'); }
      break;
    case 'kfEinheit': {
      const z = UI.kDraft && UI.kDraft.pos[+el.dataset.i], a = z && artikelNr(f, z.nr);
      if (!a) break;
      const eh = einheitenVon(a);
      z.e = eh[(eh.indexOf(z.e) + 1) % eh.length];
      el.textContent = einheitKurz(z.e);
      kfWarnungenAktualisieren(f);
      break;
    }
    case 'kfAdd': {
      const a = artikelNr(f, el.dataset.nr);
      if (!a || !UI.kDraft) break;
      UI.kDraft.pos.push({ nr: a.nr, ws: null, m: 0, e: einheitenVon(a)[0] });
      UI.kSuche = ''; neuZeichnen();
      const i = UI.kDraft.pos.length - 1, inp = $(`[data-kfm="${i}"]`);
      if (inp) inp.focus();
      break;
    }
    case 'kfDel': if (UI.kDraft) { UI.kDraft.pos.splice(+el.dataset.i, 1); neuZeichnen(); } break;
    case 'kAlleLoeschen': {
      const ids = Object.keys(S.kunden[f.id] || {});
      if (!ids.length) break;
      if (!confirm(`Alle ${ids.length} Kundenbestellungen löschen?\n\nZ. B. nach Weihnachten (Datenschutz). Sie verschwinden auch auf dem anderen Gerät. Die Rasting-Bestellung bleibt.`)) break;
      S.kunden[f.id] = {};
      (S.geloescht ||= []).push(...ids);
      speichern(); neuZeichnen(); toast('Kundenbestellungen gelöscht');
      break;
    }
    case 'abholDruck':
      if (!kundenListe(f).length) break;
      $('#druck').innerHTML = druckAbholHtml(f);
      window.print();
      break;
    case 'abgleich': zeigeOverlay(syncHtml()); break;
    case 'verbinden': verbinden(); break;
    case 'syncJetzt': syncJetzt(true); break;
    case 'trennen':
      if (confirm('Verbindung auf diesem Gerät trennen?\n\nDeine Daten bleiben auf dem Gerät. Zum erneuten Verbinden brauchst du den Schlüssel.')) {
        SY = { owner: SY.owner, repo: SY.repo, verlauf: SY.verlauf }; sySave(); zeigeOverlay(syncHtml()); neuZeichnen();
      }
      break;
    case 'hilfe': zeigeOverlay(hilfeHtml()); verStandZeigen(); break;
    case 'neuLaden': neuLaden(); break;
    case 'info': {
      zeigeOverlay(hilfeHtml()); verStandZeigen();
      const v = $('#overlay .versionen'); if (v) v.scrollIntoView({ block: 'start' });
      break;
    }
    case 'schliessen': schliesseOverlay(); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target, f = UI.firma;
  if (t.id === 'suche') { UI.suche = t.value; renderListe(); return; }
  if ((t.matches('[data-min]') || t.matches('[data-ist]')) && f) {
    setBestand(f, t.matches('[data-min]') ? 'min' : 'ist', t.dataset.nr, t.value);
    bestandAktualisieren(f, t.dataset.nr);
    return;
  }
  if (t.id === 'kFilter') { UI.kFilter = t.value; const l = $('#kListe'); if (l && f) l.innerHTML = kListeHtml(f); return; }
  if (t.id === 'kfSuche' && UI.kDraft) { UI.kSuche = t.value; const r = $('#kfTreffer'); if (r) r.innerHTML = kfTrefferHtml(f); return; }
  if (t.matches('[data-kf]') && UI.kDraft) { UI.kDraft[t.dataset.kf] = t.value; return; }
  if (t.matches('[data-kfm]') && UI.kDraft) {
    const z = UI.kDraft.pos[+t.dataset.kfm];
    if (z) { const v = parseZahl(t.value); z.m = v > 0 ? Math.round(v * 1000) / 1000 : 0; kfWarnungenAktualisieren(f); }
    return;
  }
  if (t.matches('[data-kopf]') && f) {
    (S.kopf[f.id] ||= {})[t.dataset.kopf] = t.value;
    if (t.dataset.kopf === 'besteller') S.letzterBesteller = t.value;
    speichern();
    const sub = $('#kopfSub'); if (sub) sub.innerHTML = kopfSubText(kopfDaten(f));
    const sb = $('#summenBox'); if (sb && t.dataset.kopf === 'mindestwert') sb.innerHTML = summenHtml(f);
  }
});
document.addEventListener('change', e => {
  const t = e.target, f = UI.firma;
  if (t.matches('[data-menge]')) { setMenge(f, t.dataset.nr, t.value); return; }
  if (t.matches('[data-nurmin]')) { UI.nurMin = t.checked; renderListe(); return; }
  if (t.matches('[data-sichtbar]')) {
    setSichtbar(f, t.dataset.nr, t.checked);
    t.closest('.art').classList.toggle('aus', !t.checked);
    return;
  }
  if (t.matches('[data-preis]')) {
    setPreis(f, t.dataset.nr, t.value);
    const p = preisVpe(f, artikelNr(f, t.dataset.nr));
    t.value = p !== null ? zahlDe(p) : '';
    return;
  }
  if (t.name === 'weg') { const pf = $('#partnerFeld'); if (pf) pf.hidden = t.value !== 'telefon'; return; }
  if (t.name === 'hbWeg') { const pf = $('#hbPartnerFeld'); if (pf) pf.hidden = t.value !== 'telefon'; return; }
  if (t.name === 'hbStatus') {
    const df = $('#hbDatumFeld'); if (df) df.hidden = !t.value;
    const dt = $('#hbDatumText'); if (dt) dt.textContent = t.value === 'storniert' ? 'Storniert am' : 'Geliefert am';
    return;
  }
  if (t.name === 'kAbhol' && UI.kDraft) { UI.kDraft.abhol = t.value; neuZeichnen(); return; }
  if (t.matches('[data-kfsel]') && UI.kDraft) { UI.kDraft[t.dataset.kfsel] = t.value; neuZeichnen(); return; }
  if (t.matches('[data-kstorno]') && UI.kDraft) { UI.kDraft.storniert = t.checked ? heuteDe() : ''; return; }
  if (t.matches('[data-kabgeholt]') && f) {
    const k = (S.kunden[f.id] || {})[t.dataset.kabgeholt];
    if (k) { k.abgeholt = t.checked; k.t = Date.now(); speichern(); neuZeichnen(); }
    return;
  }
  if (t.id === 'verSel') { const l = $('#verNeu'); if (l) l.innerHTML = neuerungenHtml(t.value); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#overlay').hidden) schliesseOverlay(); });
/* Zahlenfeld beim Antippen komplett markieren – so ersetzt die neue Zahl die alte */
document.addEventListener('focusin', e => { if (e.target.matches('[data-menge],[data-kfm],[data-min],[data-ist]')) setTimeout(() => e.target.select(), 0); });

function route() {
  const [id, reiter] = location.hash.replace(/^#\/?/, '').split('/');
  const f = firmaById(id);
  const neueSeite = f !== UI.firma || (reiter || 'produkte') !== UI.reiter;
  if (f !== UI.firma) { UI.zaehlen = false; UI.bearbeiten = false; UI.suche = ''; UI.kopfOffen = null; UI.histOffen = false; UI.neuOffen = false; UI.kDraft = null; UI.kSuche = ''; }
  UI.firma = f;
  UI.reiter = f && reiterVon(f).some(([id]) => id === reiter) ? reiter : 'produkte';
  render();
  if (neueSeite) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
window.addEventListener('storage', e => { if (e.key === SPEICHER_KEY) { S = laden(); SNAP = schnappschuss(); neuZeichnen(); } });
SNAP = schnappschuss();
route();
if (syAktiv()) syncJetzt(false);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (syAktiv() && Date.now() - (SY.zuletzt || 0) > 20000) syncJetzt(false);
  updatePruefen(false);
});
setTimeout(() => updatePruefen(true), 2500);
setInterval(() => { if (document.visibilityState === 'visible') updatePruefen(false); }, 10 * 60 * 1000);
/* Abgleich hat während einer Eingabe etwas geändert → nach der Eingabe neu zeichnen */
document.addEventListener('focusout', () => setTimeout(() => {
  if (UI.spaeterZeichnen && !eingabeAktiv()) { UI.spaeterZeichnen = false; neuZeichnen(); }
}, 80));

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
